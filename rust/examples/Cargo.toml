[package]
name = "horsies-examples"
version = "0.1.0-alpha.1"
edition = "2021"
publish = false

# Each example is one binary: the producer (`demo`), the worker and its
# children (`worker --profile default`), the scheduler and the check.
[dependencies]
horsies = { path = "../../crates/horsies" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
# The workflow id that `dynamic_start` returns from a task.
uuid = { version = "1", features = ["serde"] }

[lints]
workspace = true
