[workspace]
resolver = "2"
members = [
    "crates/horsies",
    "crates/horsies-codegen",
    "crates/horsies-core",
    "crates/horsies-macros",
    "crates/horsies-python",
    "rust/examples",
    "rust/showcase",
    "rust/tests/parity",
    "rust/tests/support",
    "rust/tests/worker",
    "rust/tests/queue_mismatch",
]
# syce has its own Cargo.lock and release line.
exclude = ["syce"]

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
clone_on_ref_ptr = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
needless_pass_by_value = "warn"
