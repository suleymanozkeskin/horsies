[workspace]
resolver = "2"
members = [
    "clients/rust/horsies",
    "clients/python/codegen",
    "core",
    "core/derive",
    "clients/rust/macros",
    "clients/python/bridge",
    "clients/rust/examples",
    "clients/rust/examples/showcase",
    "clients/rust/tests/arbitrary-precision",
    "clients/rust/tests/docs-check",
    "clients/rust/tests/parity",
    "clients/rust/tests/support",
    "clients/rust/tests/worker",
    "clients/rust/tests/queue_mismatch",
]

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
clone_on_ref_ptr = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
needless_pass_by_value = "warn"
# Exhaustive `match` with explicit arms is the house rule: a new variant then
# fails to compile instead of falling into an `else`.
single_match = "allow"
