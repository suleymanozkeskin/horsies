[package]
name = "horsies-parity-tests"
version = "0.1.0-alpha.1"
edition = "2021"
description = "The Rust side of the parity runs with the Python client (tests/parity)"
publish = false

# `horsies-parity send <scenario>` sends a scenario; any other command goes
# to `horsies::cli::run`: the worker, its children, the scheduler.
[[bin]]
name = "horsies-parity"
path = "src/main.rs"

[dependencies]
horsies = { path = "../../../crates/horsies" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
uuid = "1"

[lints]
workspace = true
