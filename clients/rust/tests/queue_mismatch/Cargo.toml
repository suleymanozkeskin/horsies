[package]
name = "horsies-queue-mismatch-tests"
version = "0.1.0-alpha.1"
edition = "2021"
description = "The queue guard of task registration: six scenarios of Python clients/python/tests/unit/test_queue_mismatch_guard.py"
publish = false

[dependencies]
horsies = { path = "../../horsies" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
horsies-test-support = { path = "../support" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
