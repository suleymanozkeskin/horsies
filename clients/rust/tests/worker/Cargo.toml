[package]
name = "horsies-test-worker"
version = "0.1.0-alpha.1"
edition = "2021"
description = "The app of the Rust end-to-end tests: its tasks, its instances and the binary that serves as its worker, its children and its scheduler"
publish = false

# The binary builds the app of the instance that its environment names, then
# hands over to `horsies::cli::run`: worker, worker child, scheduler, check.
[[bin]]
name = "horsies-test-worker"
path = "src/main.rs"

[dependencies]
horsies = { path = "../../../crates/horsies" }
horsies-test-support = { path = "../support" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
serial_test = "3"

[lints]
workspace = true
