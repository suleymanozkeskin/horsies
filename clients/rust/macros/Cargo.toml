[package]
name = "horsies-macros"
version = "0.8.1"
edition = "2021"
description = "Task and workflow macros of the horsies Rust client"
license = "MIT"
repository = "https://github.com/suleymanozkeskin/horsies"
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
horsies = { path = "../horsies" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trybuild = "1"
