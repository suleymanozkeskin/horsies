version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      uv-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: bun
    directory: "/website"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # @astrojs/starlight 0.38+ requires astro 6+. Lift this once astro is on 6.x.
      - dependency-name: "@astrojs/starlight"
        versions: [">=0.38.0"]
    groups:
      bun-minor-patch:
        update-types:
          - minor
          - patch
