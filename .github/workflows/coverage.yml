name: Coverage

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run full suite with coverage
        env:
          DB_PASSWORD: testpassword
        run: |
          uv run coverage erase
          uv run pytest tests/unit/ -q --tb=short --cov=horsies --cov-branch --cov-report=
          uv run pytest tests/integration/ -q --tb=short --cov=horsies --cov-branch --cov-append --cov-report=
          # Every normal-topology e2e file, derived by the shared runner; only
          # the PgBouncer smoke stays out — measuring it would need a second
          # topology in this job for a marginal coverage change.
          scripts/run_e2e_suite.sh -q --tb=short --cov=horsies --cov-branch --cov-append --cov-report=
          uv run coverage json -o coverage.json
          uv run coverage xml -o coverage.xml
          uv run coverage report

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage.xml

      - name: Show coverage summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("coverage.json").read_text())
          percent = data["totals"]["percent_covered_display"]
          with open(Path.home() / "summary.txt", "w") as fh:
              fh.write(f"## Coverage\n\nTotal coverage: **{percent}%**\n")
          PY
          cat "$HOME/summary.txt" >> "$GITHUB_STEP_SUMMARY"
