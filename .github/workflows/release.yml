name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built distributions to PyPI
        required: true
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read package version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          print(f"version={pyproject['project']['version']}")
          PY

      - name: Show release metadata
        run: echo "Preparing release for horsies ${{ steps.version.outputs.version }}"

  # The publish gate is the full suite — both PostgreSQL majors, every e2e
  # file, PgBouncer, and the measurement-harness control — run against the
  # exact commit being published. Calling the reusable workflow keeps one
  # authoritative definition instead of a copied subset that drifts.
  tests:
    needs: metadata
    permissions:
      contents: read
    uses: ./.github/workflows/tests-full.yml

  build:
    needs: [metadata, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.14
          enable-cache: false

      - name: Install dependencies
        run: uv sync --dev

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # webui/bun.lock is lockfileVersion 1; pin a stable bun that reads
          # and writes that format so --frozen-lockfile stays meaningful.
          bun-version: "1.3.14"

      - name: Build web UI assets
        working-directory: webui
        # Must precede the wheel build: the wheel ships this output as
        # package data, and the source tree never contains it.
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Clean dist directory
        run: rm -rf dist

      - name: Build distributions
        run: uv build

      - name: Verify the wheel carries the built web UI
        # A wheel with an empty static tree installs cleanly and then serves
        # 503 on every page, so this is release-blocking rather than advisory.
        run: |
          set -euo pipefail
          wheel=$(ls dist/horsies-*.whl)
          echo "Inspecting $wheel"
          contents=$(unzip -l "$wheel")
          echo "$contents" | grep -q 'horsies/web/static/index.html' \
            || { echo 'FAIL: horsies/web/static/index.html missing from wheel'; exit 1; }
          echo "$contents" | grep -Eq 'horsies/web/static/assets/.+\.js' \
            || { echo 'FAIL: no hashed JS asset under horsies/web/static/assets'; exit 1; }
          echo "$contents" | grep -Eq 'horsies/web/static/assets/.+\.css' \
            || { echo 'FAIL: no hashed CSS asset under horsies/web/static/assets'; exit 1; }
          echo 'OK: wheel carries the built web UI'

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: horsies-dist-${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish }}
    needs: [metadata, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: horsies-dist-${{ needs.metadata.outputs.version }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
