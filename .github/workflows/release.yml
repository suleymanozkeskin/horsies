name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built distributions to PyPI
        required: true
        default: true
        type: boolean
      # Off unless the dispatch turns it on. With it off, the crate jobs
      # still package and verify both crates, and publish nothing.
      publish_crates:
        description: Publish horsies-macros and horsies to crates.io
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read package version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          print(f"version={pyproject['project']['version']}")
          PY

      - name: Show release metadata
        run: echo "Preparing release for horsies ${{ steps.version.outputs.version }}"

  # The publish gate is the full suite — both PostgreSQL majors, every e2e
  # file, PgBouncer, and the measurement-harness control — run against the
  # exact commit being published. Calling the reusable workflow keeps one
  # authoritative definition instead of a copied subset that drifts.
  tests:
    needs: metadata
    permissions:
      contents: read
    uses: ./.github/workflows/tests-full.yml

  build:
    needs: [metadata, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: false

      - name: Install dependencies
        run: uv sync --dev

      - name: Clean dist directory
        run: rm -rf dist

      - name: Build distributions
        run: uv build

      - name: Verify the wheel serves the web UI from horsies._core
        # horsies._core embeds crates/horsies-core/webui-dist. The installed
        # wheel serves the page and its script with no database: a wheel
        # whose page answers 503 installs cleanly and then fails every
        # dashboard, so this is release-blocking rather than advisory.
        run: |
          set -euo pipefail
          wheel=$(ls dist/horsies-*.whl)
          echo "Inspecting $wheel"
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python \
            "horsies[web] @ file://${PWD}/${wheel}" httpx
          /tmp/wheel-check/bin/python - <<'PY'
          import asyncio
          import re

          from httpx import ASGITransport, AsyncClient
          from pydantic import SecretStr

          from horsies.core.app import Horsies
          from horsies.core.models.app import AppConfig
          from horsies.core.models.broker import PostgresConfig
          from horsies.web import AllowAll, create_monitoring_app


          async def main() -> None:
              app = Horsies(
                  AppConfig(
                      broker=PostgresConfig(
                          database_url=SecretStr('postgresql://check:none@127.0.0.1:1/none'),
                      ),
                  ),
              )
              web = create_monitoring_app(app, auth_policy=AllowAll())
              transport = ASGITransport(app=web)
              async with AsyncClient(transport=transport, base_url='http://check') as client:
                  page = await client.get('/')
                  assert page.status_code == 200, f'GET / answered {page.status_code}'
                  assert '__HORSIES_UI__' in page.text, 'the page has no injected config'
                  script = re.search(r'(assets/[^"]+[.]js)', page.text)
                  assert script is not None, 'the page names no script asset'
                  asset = await client.get(f'/{script.group(1)}')
                  assert asset.status_code == 200, f'the script answered {asset.status_code}'
              await web.state.events.close()
              print('OK: the wheel serves the web UI from horsies._core')


          asyncio.run(main())
          PY

      - name: Verify the wheel carries the agent skill folder
        # `horsies skills install` copies this folder from the installed
        # package. A wheel without it installs cleanly and the command then
        # fails for every user, so this is release-blocking.
        run: |
          set -euo pipefail
          wheel=$(ls dist/horsies-*.whl)
          contents=$(unzip -l "$wheel")
          for name in SKILL.md tasks.md workflows.md configs.md monitoring.md; do
            echo "$contents" | grep -q "horsies/.agents/skills/horsies/$name" \
              || { echo "FAIL: horsies/.agents/skills/horsies/$name missing from wheel"; exit 1; }
          done
          echo 'OK: wheel carries the agent skill folder'

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: horsies-dist-${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish }}
    needs: [metadata, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: horsies-dist-${{ needs.metadata.outputs.version }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  crate-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Both crates release together: horsies pins horsies-macros to its own
      # version.
      - name: Read and check crate versions
        id: version
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib
          from pathlib import Path

          client = tomllib.loads(Path("crates/horsies/Cargo.toml").read_text())
          macros = tomllib.loads(Path("crates/horsies-macros/Cargo.toml").read_text())
          client_version = client["package"]["version"]
          macros_version = macros["package"]["version"]
          macros_requirement = client["dependencies"]["horsies-macros"]["version"]
          if not (client_version == macros_version == macros_requirement):
              print(
                  "::error::crate versions disagree: "
                  f"horsies {client_version}, horsies-macros {macros_version}, "
                  f"horsies-macros requirement in horsies {macros_requirement}"
              )
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={client_version}\n")
          print(f"horsies and horsies-macros {client_version}")
          PY

  build-crates:
    needs: [crate-metadata, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.crate-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # rustup is preinstalled on the runner. With no argument it installs the
      # toolchain and components that rust-toolchain.toml names.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      # Packages both crates in dependency order and builds each package.
      # The build of horsies resolves horsies-macros from the package made in
      # this step, so a new version needs nothing on crates.io yet. Cargo
      # leaves the path-only dev-dependency of horsies-macros on horsies out
      # of the packaged manifest. A version that is already on crates.io is
      # a warning here and an error in the publish jobs.
      - name: Package and verify the crates
        run: cargo publish --dry-run -p horsies-macros -p horsies

      # The crate embeds migrations/ with sqlx::migrate! and webui-dist/ with
      # include_dir!. A package without them builds but cannot migrate or
      # serve the web UI.
      - name: Verify the horsies crate carries its migrations and web UI build
        run: |
          set -euo pipefail
          crate="target/package/horsies-${VERSION}.crate"
          packaged="$(tar -tzf "$crate" | sed "s|^horsies-${VERSION}/||")"
          for folder in migrations webui-dist; do
            expected="$(git ls-files -- "crates/horsies/$folder" | sed 's|^crates/horsies/||' | LC_ALL=C sort)"
            actual="$(printf '%s\n' "$packaged" | { grep "^$folder/" || true; } | LC_ALL=C sort)"
            if [ -z "$expected" ]; then
              echo "::error::crates/horsies/$folder/ has no tracked files"
              exit 1
            fi
            if [ "$expected" != "$actual" ]; then
              echo "::error::$crate does not hold exactly the tracked files of crates/horsies/$folder/"
              diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
              exit 1
            fi
            echo "OK: $crate holds the $(printf '%s\n' "$expected" | wc -l | tr -d ' ') tracked files of crates/horsies/$folder/"
          done

      - name: Upload verified crates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: horsies-crates-${{ needs.crate-metadata.outputs.version }}
          path: |
            target/package/horsies-macros-${{ needs.crate-metadata.outputs.version }}.crate
            target/package/horsies-${{ needs.crate-metadata.outputs.version }}.crate
          if-no-files-found: error

  # One job per crate, so that "Re-run failed jobs" after a failed horsies
  # publish does not publish horsies-macros again.
  publish-horsies-macros:
    if: ${{ inputs.publish_crates }}
    needs: [crate-metadata, build-crates]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.crate-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Download verified crates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: horsies-crates-${{ needs.crate-metadata.outputs.version }}
          path: ${{ runner.temp }}/verified-crates

      # cargo publish uploads a package that it makes itself. Packaging is
      # reproducible for one commit and one Cargo.lock, so this check shows
      # that the upload is the crate that build-crates verified.
      - name: Check the package against the verified crate
        run: |
          set -euo pipefail
          cargo package -p horsies-macros --no-verify
          name="horsies-macros-${VERSION}.crate"
          built="$(sha256sum "target/package/$name" | cut -d' ' -f1)"
          verified="$(sha256sum "$RUNNER_TEMP/verified-crates/$name" | cut -d' ' -f1)"
          if [ "$built" != "$verified" ]; then
            echo "::error::$name sha256 $built differs from the verified crate $verified"
            exit 1
          fi
          echo "OK: $name sha256 $built"

      # Trusted publishing: crates.io exchanges this job's OIDC token for a
      # token that the action revokes when the job ends.
      - name: Get a crates.io token
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish horsies-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish -p horsies-macros

  publish-horsies:
    if: ${{ inputs.publish_crates }}
    needs: [crate-metadata, publish-horsies-macros]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.crate-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Download verified crates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: horsies-crates-${{ needs.crate-metadata.outputs.version }}
          path: ${{ runner.temp }}/verified-crates

      # The packaged Cargo.lock records the checksum of horsies-macros as
      # crates.io serves it. The sha256 matches the verified crate only when
      # the horsies-macros on crates.io is the verified one.
      - name: Check the package against the verified crate
        run: |
          set -euo pipefail
          cargo package -p horsies --no-verify
          name="horsies-${VERSION}.crate"
          built="$(sha256sum "target/package/$name" | cut -d' ' -f1)"
          verified="$(sha256sum "$RUNNER_TEMP/verified-crates/$name" | cut -d' ' -f1)"
          if [ "$built" != "$verified" ]; then
            echo "::error::$name sha256 $built differs from the verified crate $verified"
            exit 1
          fi
          echo "OK: $name sha256 $built"

      - name: Get a crates.io token
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish horsies
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish -p horsies
