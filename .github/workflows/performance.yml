  rerun-input-terminalization:
    if: inputs.suite == 'rerun-input-terminalization'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '14'
            service: pg14
            port: 15442
            image: docker.io/library/postgres:14@sha256:c6f9b7243c56553c050bec9a76bb9b9befb15b260ae1e4ac4bf9b56bd99c26a5
          - postgres: '16'
            service: pg16
            port: 15446
            image: docker.io/library/postgres:16@sha256:da8cf245a60506e50a0a8cbb0f39c559ca622d92490605b67fcadc74ca1ea8e4
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Start PostgreSQL ${{ matrix.postgres }} measurement server
        run: >-
          docker compose -f tests/fixtures/perf/compose.yaml
          up -d --wait ${{ matrix.service }}

      - name: Apply schema
        run: >-
          uv run python -m tests.perf --apply-schema
          --dsn postgresql+psycopg://postgres:testpassword@localhost:${{ matrix.port }}/horsies

      - name: Declare capacity and confirm the runner can hold a cell
        shell: bash
        run: |
          # Incompressible envelopes at the inline bound do not compress, so a
          # cell's footprint is predictable and large. Stating it here means an
          # undersized runner refuses before the first cell rather than dying
          # partway through one as an out-of-space traceback.
          declared_peak=$(uv run python -c "
          from tests.task_history_prototypes.rerun_terminalization_evidence import (
              declare_cell_capacity,
          )
          print(
              declare_cell_capacity(
                  observations=10000,
                  block_size=100,
                  envelope_bytes=65536,
                  free_bytes=0,
              ).declared_peak_bytes
          )
          ")
          # The root filesystem, not the docker data root: the overlay2 storage
          # lives on it, and /var/lib/docker is root-owned so statting it as
          # the runner user can fail on permissions rather than on space.
          free=$(df --output=avail -B1 / | tail -1)
          echo "declared peak bytes: ${declared_peak}"
          echo "free bytes on the runner root filesystem: ${free}"
          if (( free < declared_peak )); then
            echo "::error::runner has ${free} bytes free; one cell declares a" \
                 "peak of ${declared_peak} bytes"
            exit 1
          fi

      - name: Rerun-input paired terminalization qualification
        timeout-minutes: 345
        shell: bash
        run: |
          output_dir=/tmp/task-history-rerun-terminalization-pg${{ matrix.postgres }}
          mkdir -p "$output_dir"
          output="$output_dir/paired-terminalization.json"
          partial="$output_dir/paired-terminalization.partial.json"
          candidate_output="$output.candidate"
          error_log="$output.stderr"
          exec 3>&1
          set +e
          uv run python -m tests.task_history_prototypes \
            --dsn postgresql+psycopg://postgres:testpassword@localhost:${{ matrix.port }}/horsies \
            --commit '${{ github.sha }}' \
            --run-kind gate \
            --server-image '${{ matrix.image }}' \
            --host-description 'GitHub-hosted ephemeral x86_64 VM; repository application units absent' \
            --storage-description 'GitHub-hosted runner Docker overlay2 storage' \
            --scenario rerun-input-terminalization \
            --warm-observations 10000 \
            --batch-size 100 \
            --bootstrap-resamples 1000 \
            --rerun-input-bytes 65536 \
            --result-bytes 200 \
            --data-path / \
            --partial-evidence-path "$partial" \
            --progress-fd 3 \
            --demo-quiesced > "$candidate_output" 2> "$error_log"
          collector_status=$?
          set -e
          if (( collector_status != 0 )); then
            jq -n \
              --arg commit '${{ github.sha }}' \
              --arg postgres_major '${{ matrix.postgres }}' \
              --arg server_image '${{ matrix.image }}' \
              --argjson collector_status "$collector_status" \
              --rawfile error "$error_log" \
              '{
                status: "execution_failure",
                scenario: "rerun-input-terminalization",
                conditions: {
                  commit: $commit,
                  run_kind: "gate",
                  postgres_major: $postgres_major,
                  server_image: $server_image,
                  demo_quiesced: true,
                  durability_mode: "paired-micro"
                },
                workload: {
                  observations_per_side: 10000,
                  block_size: 100,
                  bootstrap_resamples: 1000,
                  envelope_bytes: 65536,
                  result_bytes: 200
                },
                collector_exit_status: $collector_status,
                error: $error
              }' > "$output"
            exit "$collector_status"
          fi
          mv "$candidate_output" "$output"
          jq -e '.verdict' "$output"
          jq -e '(.cells | length) == 4' "$output"

      - name: Preserve paired terminalization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rerun-input-terminalization-pg${{ matrix.postgres }}
          path: /tmp/task-history-rerun-terminalization-pg${{ matrix.postgres }}/*
          if-no-files-found: error

      - name: Stop PostgreSQL ${{ matrix.postgres }} measurement server
        if: always()
        run: docker compose -f tests/fixtures/perf/compose.yaml down -v

