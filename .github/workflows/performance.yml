name: Performance Harness

# Manual evidence only. Correctness and release workflows do not invoke it.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Qualification suite
        required: true
        type: choice
        default: full
        options:
          - full
          - staged-lookup
          - storage-qualification
          - uuid-index
          - operational-maintenance
          - rerun-input-terminalization
          - migration-ladder-rung1
          - migration-ladder-rung2

permissions: {}

jobs:
  harness:
    if: inputs.suite == 'full'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Start measurement servers
        run: docker compose -f tests/fixtures/perf/compose.yaml up -d --wait

      - name: Apply schema
        run: |
          for port in 15442 15446; do
            uv run python -m tests.perf --apply-schema \
              --dsn postgresql+psycopg://postgres:testpassword@localhost:${port}/horsies
          done

      - name: Measurement harness control run
        run: |
          for port in 15442 15446; do
            uv run python -m tests.perf --scenario all --scale smoke \
              --control \
              --dsn postgresql+psycopg://postgres:testpassword@localhost:${port}/horsies
          done

      - name: Stop measurement servers
        if: always()
        run: docker compose -f tests/fixtures/perf/compose.yaml down -v

  replacement-archive-transcode:
    if: inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '14'
            service: pg14
            port: 16442
            image: docker.io/library/postgres:14@sha256:c6f9b7243c56553c050bec9a76bb9b9befb15b260ae1e4ac4bf9b56bd99c26a5
          - postgres: '16'
            service: pg16
            port: 16446
            image: docker.io/library/postgres:16@sha256:da8cf245a60506e50a0a8cbb0f39c559ca622d92490605b67fcadc74ca1ea8e4
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Start PostgreSQL ${{ matrix.postgres }} operational server
        run: >-
          docker compose -f tests/fixtures/history/compose.yaml
          up -d --wait ${{ matrix.service }}

      - name: Apply schema
        run: >-
          uv run python -m tests.perf --apply-schema
          --dsn postgresql+psycopg://postgres:testpassword@localhost:${{ matrix.port }}/horsies

      # Run every domain even after one misses a budget so the preserved
      # evidence gives the operator a complete failure shape. The final exit
      # status is nonzero if execution, verification, retirement, or any
      # declared budget fails.
      - name: Replacement archive transcode qualification
        shell: bash
        run: |
          output_dir=/tmp/task-history-replacement-pg${{ matrix.postgres }}
          mkdir -p "$output_dir"
          failures=0
          for component in HISTORY_ROW RESULT ATTEMPTS RERUN_INPUT; do
            attempts=4
            if [[ "$component" == "ATTEMPTS" ]]; then
              attempts=21
            fi
            output="$output_dir/${component,,}.json"
            partial_output="$output.partial.json"
            candidate_output="$output.candidate"
            error_log="$output.stderr"
            if ! uv run python -m tests.task_history_prototypes \
              --dsn postgresql+psycopg://postgres:testpassword@localhost:${{ matrix.port }}/horsies \
              --commit '${{ github.sha }}' \
              --run-kind gate \
              --server-image '${{ matrix.image }}' \
              --host-description 'GitHub-hosted ephemeral x86_64 VM; repository application units absent' \
              --storage-description 'GitHub-hosted runner Docker overlay2 storage' \
              --scenario replacement-archive-transcode \
              --archive-component "$component" \
              --rows 1000000 \
              --batch-size 100000 \
              --result-bytes 200 \
              --attempts-per-task "$attempts" \
              --partial-evidence-path "$partial_output" \
              --demo-quiesced > "$candidate_output" 2> "$error_log"
            then
              failure_evidence=null
              if [[ -s "$partial_output" ]]; then
                failure_evidence="$(jq -c . "$partial_output")"
              fi
              jq -n \
                --arg component "$component" \
                --arg commit '${{ github.sha }}' \
                --arg postgres_major '${{ matrix.postgres }}' \
                --arg server_image '${{ matrix.image }}' \
                --arg host_description 'GitHub-hosted ephemeral x86_64 VM; repository application units absent' \
                --arg storage_description 'GitHub-hosted runner Docker overlay2 storage' \
                --argjson attempts_per_task "$attempts" \
                --argjson failure_evidence "$failure_evidence" \
                --rawfile error "$error_log" \
                '{
                  status: "execution_failure",
                  component: $component,
                  conditions: {
                    commit: $commit,
                    run_kind: "gate",
                    postgres_major: $postgres_major,
                    server_image: $server_image,
                    host_description: $host_description,
                    storage_description: $storage_description,
                    demo_quiesced: true,
                    durability_mode: "operational",
                    cache_posture: "explicit checkpoint; payload controls receive an untimed source validation warmup before the paired control and candidate; replacement relations use committed task-ID batches",
                    prepared_posture: "parameterized seed and durable replacement-copy program",
                    fsync: "on",
                    synchronous_commit: "on",
                    full_page_writes: "on",
                    autovacuum: "on",
                    autovacuum_vacuum_threshold: "50",
                    autovacuum_vacuum_scale_factor: "0.2",
                    autovacuum_analyze_threshold: "50",
                    autovacuum_analyze_scale_factor: "0.1",
                    autovacuum_naptime: "1min",
                    autovacuum_max_workers: "3",
                    checkpoint_timeout: "5min",
                    max_wal_size: "2GB"
                  },
                  workload: {
                    rows: 1000000,
                    batch_size: 100000,
                    payload_bytes: 200,
                    attempts_per_task: $attempts_per_task
                  },
                  budgets: {
                    metadata_tasks_per_second_minimum: 20000,
                    payload_control_ratio_minimum: 0.5,
                    maintenance_seconds_maximum: 600,
                    swap_lock_seconds_maximum: 2,
                    swap_lock_attempts_maximum: 120,
                    swap_retry_backoff_seconds: 0.25
                  },
                  failure_evidence: $failure_evidence,
                  error: $error
                }' > "$output"
              failures=1
              continue
            fi
            mv "$candidate_output" "$output"
            if ! jq -e '
              .verification.verified
              and .decoder_retirement_ready
              and .throughput_passed
              and .maintenance_duration_passed
              and .swap_window_passed
              and .wal_passed
              and .peak_disk_passed
            ' "$output"
            then
              failures=1
            fi
          done
          exit "$failures"

      - name: Preserve replacement qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: replacement-archive-transcode-pg${{ matrix.postgres }}
          path: /tmp/task-history-replacement-pg${{ matrix.postgres }}/*.json
          if-no-files-found: error

      - name: Stop PostgreSQL ${{ matrix.postgres }} operational server
        if: always()
        run: docker compose -f tests/fixtures/history/compose.yaml down -v

  identity-lookup-boundary:
    if: inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '14'
            service: pg14
            port: 15442
            image: docker.io/library/postgres:14@sha256:c6f9b7243c56553c050bec9a76bb9b9befb15b260ae1e4ac4bf9b56bd99c26a5
          - postgres: '16'
            service: pg16
            port: 15446
            image: docker.io/library/postgres:16@sha256:da8cf245a60506e50a0a8cbb0f39c559ca622d92490605b67fcadc74ca1ea8e4
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Start PostgreSQL ${{ matrix.postgres }} measurement server
        run: >-
          docker compose -f tests/fixtures/perf/compose.yaml
          up -d --wait ${{ matrix.service }}

      - name: Apply schema
        run: >-
          uv run python -m tests.perf --apply-schema
          --dsn postgresql+psycopg://postgres:testpassword@localhost:${{ matrix.port }}/horsies

      # The harness prints the evidence document and exits zero even when a
      # latency budget fails; the verdicts live inside the document. The final
      # exit status is nonzero if execution fails or any lookup cell across
      # every candidate and posture reports a verdict other than PASS.
      - name: Identity lookup boundary qualification
        timeout-minutes: 345
        shell: bash
        run: |
          output_dir=/tmp/task-history-identity-pg${{ matrix.postgres }}
          mkdir -p "$output_dir"
          output="$output_dir/identity_lookup.json"
          partial_output="$output_dir/identity_lookup.partial.json"
          candidate_output="$output.candidate"
          error_log="$output.stderr"
          exec 3>&1
          set +e
          timeout --foreground --signal=TERM --kill-after=30s 330m \
            uv run python -m tests.task_history_prototypes \
            --dsn postgresql+psycopg://postgres:testpassword@localhost:${{ matrix.port }}/horsies \
            --commit '${{ github.sha }}' \
            --run-kind gate \
            --server-image '${{ matrix.image }}' \
            --host-description 'GitHub-hosted ephemeral x86_64 VM; repository application units absent' \
            --storage-description 'GitHub-hosted runner Docker overlay2 storage' \
            --scenario identity-lookup \
            --live-rows 100000 \
            --finite-history-rows 10000000 \
            --forever-history-rows 1000000 \
            --attached-finite-leaves 512 \
            --keyed-percent 10 \
            --warm-observations 10000 \
            --cold-observations 10000 \
            --bootstrap-resamples 1000 \
            --partial-evidence-path "$partial_output" \
            --progress-fd 3 \
            --demo-quiesced > "$candidate_output" 2> "$error_log"
          collector_status=$?
          set -e
          if (( collector_status != 0 )); then
            partial_evidence=null
            if [[ -s "$partial_output" ]]; then
              partial_evidence="$(jq -c . "$partial_output")"
            fi
            jq -n \
              --arg commit '${{ github.sha }}' \
              --arg postgres_major '${{ matrix.postgres }}' \
              --arg server_image '${{ matrix.image }}' \
              --arg host_description 'GitHub-hosted ephemeral x86_64 VM; repository application units absent' \
              --arg storage_description 'GitHub-hosted runner Docker overlay2 storage' \
              --argjson collector_status "$collector_status" \
              --argjson partial_evidence "$partial_evidence" \
              --rawfile error "$error_log" \
              '{
                status: "execution_failure",
                scenario: "identity-lookup",
                conditions: {
                  commit: $commit,
                  run_kind: "gate",
                  postgres_major: $postgres_major,
                  server_image: $server_image,
                  host_description: $host_description,
                  storage_description: $storage_description,
                  demo_quiesced: true,
                  fsync: "off",
                  synchronous_commit: "off",
                  full_page_writes: "off",
                  autovacuum: "off",
                  autovacuum_vacuum_threshold: "50",
                  autovacuum_vacuum_scale_factor: "0.2",
                  autovacuum_analyze_threshold: "50",
                  autovacuum_analyze_scale_factor: "0.1",
                  autovacuum_naptime: "1min",
                  autovacuum_max_workers: "3",
                  checkpoint_timeout: "30min",
                  max_wal_size: "4GB"
                },
                workload: {
                  live_rows: 100000,
                  finite_history_rows: 10000000,
                  forever_history_rows: 1000000,
                  attached_finite_leaves: 512,
                  keyed_percent: 10,
                  warm_observations_per_category: 10000,
                  cold_observation_ladder: [500, 2000, 10000],
                  cold_observations_maximum: 10000,
                  bootstrap_resamples: 1000
                },
                collector_exit_status: $collector_status,
                partial_evidence: $partial_evidence,
                error: $error
              }' > "$output"
            exit 1
          fi
          mv "$candidate_output" "$output"
          jq -e '
            [.candidates[].lookup[].verdict]
            | length > 0 and all(. == "PASS")
          ' "$output"

      - name: Preserve identity qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: identity-lookup-boundary-pg${{ matrix.postgres }}
          path: /tmp/task-history-identity-pg${{ matrix.postgres }}/*.json
          if-no-files-found: error

      - name: Stop PostgreSQL ${{ matrix.postgres }} measurement server
        if: always()
        run: docker compose -f tests/fixtures/perf/compose.yaml down -v

  staged-lookup-boundary:
    if: inputs.suite == 'staged-lookup'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '14'
            service: pg14
            port: 15442
            image: docker.io/library/postgres:14@sha256:c6f9b7243c56553c050bec9a76bb9b9befb15b260ae1e4ac4bf9b56bd99c26a5
          - postgres: '16'
            service: pg16
            port: 15446
            image: docker.io/library/postgres:16@sha256:da8cf245a60506e50a0a8cbb0f39c559ca622d92490605b67fcadc74ca1ea8e4
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Start PostgreSQL ${{ matrix.postgres }} measurement server
        run: >-
          docker compose -f tests/fixtures/perf/compose.yaml
          up -d --wait ${{ matrix.service }}

      - name: Apply schema
        run: >-
          uv run python -m tests.perf --apply-schema
          --dsn postgresql+psycopg://postgres:testpassword@localhost:${{ matrix.port }}/horsies

      - name: Staged lookup boundary qualification
        timeout-minutes: 345
        shell: bash
        run: |
          output_dir=/tmp/task-history-staged-lookup-pg${{ matrix.postgres }}
          mkdir -p "$output_dir"
          output="$output_dir/staged_lookup.json"
          partial_output="$output_dir/staged_lookup.partial.json"
          candidate_output="$output.candidate"
          error_log="$output.stderr"
          exec 3>&1
          set +e
          timeout --foreground --signal=TERM --kill-after=30s 330m \
            uv run python -m tests.task_history_prototypes \
            --dsn postgresql+psycopg://postgres:testpassword@localhost:${{ matrix.port }}/horsies \
            --commit '${{ github.sha }}' \
            --run-kind gate \
            --server-image '${{ matrix.image }}' \
            --host-description 'GitHub-hosted ephemeral x86_64 VM; repository application units absent' \
            --storage-description 'GitHub-hosted runner Docker overlay2 storage' \
            --scenario identity-lookup \
            --identity-candidate staged_key_registry \
            --live-rows 100000 \
            --finite-history-rows 10000000 \
            --forever-history-rows 1000000 \
            --attached-finite-leaves 512 \
            --keyed-percent 10 \
            --warm-observations 10000 \
            --cold-observations 10000 \
            --bootstrap-resamples 1000 \
            --partial-evidence-path "$partial_output" \
            --progress-fd 3 \
            --demo-quiesced > "$candidate_output" 2> "$error_log"
          collector_status=$?
          set -e
          if (( collector_status != 0 )); then
            partial_evidence=null
            if [[ -s "$partial_output" ]]; then
              partial_evidence="$(jq -c . "$partial_output")"
            fi
            jq -n \
              --arg commit '${{ github.sha }}' \
              --arg postgres_major '${{ matrix.postgres }}' \
              --arg server_image '${{ matrix.image }}' \
              --argjson collector_status "$collector_status" \
              --argjson partial_evidence "$partial_evidence" \
              --rawfile error "$error_log" \
              '{
                status: "execution_failure",
                scenario: "staged-task-lookup",
                conditions: {
                  commit: $commit,
                  run_kind: "gate",
                  postgres_major: $postgres_major,
                  server_image: $server_image,
                  host_description: "GitHub-hosted ephemeral x86_64 VM; repository application units absent",
                  storage_description: "GitHub-hosted runner Docker overlay2 storage",
                  demo_quiesced: true,
                  fsync: "off",
                  synchronous_commit: "off",
                  full_page_writes: "off",
                  autovacuum: "off",
                  autovacuum_vacuum_threshold: "50",
                  autovacuum_vacuum_scale_factor: "0.2",
                  autovacuum_analyze_threshold: "50",
                  autovacuum_analyze_scale_factor: "0.1",
                  autovacuum_naptime: "1min",
                  autovacuum_max_workers: "3",
                  checkpoint_timeout: "30min",
                  max_wal_size: "4GB"
                },
                workload: {
                  candidate: "staged_key_registry",
                  live_rows: 100000,
                  finite_history_rows: 10000000,
                  forever_history_rows: 1000000,
                  attached_finite_leaves: 512,
                  keyed_percent: 10,
                  warm_observations_per_category: 10000,
                  cold_observation_ladder: [500, 2000, 10000],
                  cold_observations_maximum: 10000,
                  bootstrap_resamples: 1000
                },
                collector_exit_status: $collector_status,
                partial_evidence: $partial_evidence,
                error: $error
              }' > "$output"
            exit 1
          fi
          mv "$candidate_output" "$output"
          jq -e '
            (.candidates | length) == 1
            and .candidates[0].candidate == "staged_key_registry"
            and (.candidates[0].lookup | length) == 18
            and ([.candidates[0].lookup[].verdict] | all(. == "PASS"))
          ' "$output"

      - name: Preserve staged lookup qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staged-task-lookup-pg${{ matrix.postgres }}
          path: /tmp/task-history-staged-lookup-pg${{ matrix.postgres }}/*.json
          if-no-files-found: error

      - name: Stop PostgreSQL ${{ matrix.postgres }} measurement server
        if: always()
        run: docker compose -f tests/fixtures/perf/compose.yaml down -v

  attempt-storage-qualification:
    if: inputs.suite == 'storage-qualification'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '14'
            service: pg14
            port: 15442
            image: docker.io/library/postgres:14@sha256:c6f9b7243c56553c050bec9a76bb9b9befb15b260ae1e4ac4bf9b56bd99c26a5
          - postgres: '16'
            service: pg16
            port: 15446
            image: docker.io/library/postgres:16@sha256:da8cf245a60506e50a0a8cbb0f39c559ca622d92490605b67fcadc74ca1ea8e4
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Start PostgreSQL ${{ matrix.postgres }} measurement server
        run: >-
          docker compose -f tests/fixtures/perf/compose.yaml
          up -d --wait ${{ matrix.service }}

      - name: Apply schema
        run: >-
          uv run python -m tests.perf --apply-schema
          --dsn postgresql+psycopg://postgres:testpassword@localhost:${{ matrix.port }}/horsies

      - name: Aggregate attempt qualification
        timeout-minutes: 345
        shell: bash
        run: |
          output_dir=/tmp/task-history-attempts-pg${{ matrix.postgres }}
          mkdir -p "$output_dir"
          output="$output_dir/attempts.json"
          candidate_output="$output.candidate"
          error_log="$output.stderr"
          if ! uv run python -m tests.task_history_prototypes \
            --dsn postgresql+psycopg://postgres:testpassword@localhost:${{ matrix.port }}/horsies \
            --commit '${{ github.sha }}' \
            --run-kind gate \
            --server-image '${{ matrix.image }}' \
            --host-description 'GitHub-hosted ephemeral x86_64 VM; repository application units absent' \
            --storage-description 'GitHub-hosted runner Docker overlay2 storage' \
            --scenario attempt-storage \
            --rows 1000000 \
            --result-bytes 200 \
            --attempts-per-task 21 \
            --warm-observations 10000 \
            --bootstrap-resamples 1000 \
            --payload-shape incompressible \
            --demo-quiesced > "$candidate_output" 2> "$error_log"
          then
            jq -n \
              --arg commit '${{ github.sha }}' \
              --arg postgres_major '${{ matrix.postgres }}' \
              --rawfile error "$error_log" \
              '{status: "execution_failure", scenario: "attempt-storage",
                conditions: {commit: $commit, run_kind: "gate",
                  postgres_major: $postgres_major,
                  durability_mode: "paired-micro"},
                workload: {rows: 1000000, attempts_per_task: 21,
                  detail_observations: 10000}, error: $error}' > "$output"
            exit 1
          fi
          mv "$candidate_output" "$output"
          jq -e '
            .aggregate_logical_payload_passed
            and .aggregate.detail_latency.verdict == "PASS"
            and .copartitioned.detail_latency.verdict == "PASS"
          ' "$output"

      - name: Preserve attempt evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attempt-storage-pg${{ matrix.postgres }}
          path: /tmp/task-history-attempts-pg${{ matrix.postgres }}/*.json
          if-no-files-found: error

      - name: Stop PostgreSQL ${{ matrix.postgres }} measurement server
        if: always()
        run: docker compose -f tests/fixtures/perf/compose.yaml down -v

  rerun-input-qualification:
    if: inputs.suite == 'storage-qualification'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '14'
            service: pg14
            port: 15442
            image: docker.io/library/postgres:14@sha256:c6f9b7243c56553c050bec9a76bb9b9befb15b260ae1e4ac4bf9b56bd99c26a5
          - postgres: '16'
            service: pg16
            port: 15446
            image: docker.io/library/postgres:16@sha256:da8cf245a60506e50a0a8cbb0f39c559ca622d92490605b67fcadc74ca1ea8e4
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Start PostgreSQL ${{ matrix.postgres }} measurement server
        run: >-
          docker compose -f tests/fixtures/perf/compose.yaml
          up -d --wait ${{ matrix.service }}

      - name: Apply schema
        run: >-
          uv run python -m tests.perf --apply-schema
          --dsn postgresql+psycopg://postgres:testpassword@localhost:${{ matrix.port }}/horsies

      - name: Rerun-input qualification and capacity preview
        timeout-minutes: 345
        shell: bash
        run: |
          output_dir=/tmp/task-history-rerun-pg${{ matrix.postgres }}
          mkdir -p "$output_dir"
          gate_output="$output_dir/compressible-gate.json"
