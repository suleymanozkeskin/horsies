name: Performance Harness

# Manual evidence only. Correctness and release workflows do not invoke it.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Qualification suite
        required: true
        type: choice
        default: full
        options:
          - full

permissions: {}

# The Python project is clients/python/. A step that runs uv at the
# repository root uses its pyproject.toml, uv.lock and .venv.
env:
  UV_PROJECT: ${{ github.workspace }}/clients/python

jobs:
  harness:
    if: inputs.suite == 'full'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Start measurement servers
        run: docker compose -f crossclient/fixtures/perf/compose.yaml up -d --wait

      - name: Apply schema
        run: |
          for port in 15442 15446; do
            uv run python -m crossclient.perf --apply-schema \
              --dsn postgresql://postgres:testpassword@localhost:${port}/horsies
          done

      - name: Measurement harness control run
        run: |
          for port in 15442 15446; do
            uv run python -m crossclient.perf --scenario all --scale smoke \
              --control \
              --dsn postgresql://postgres:testpassword@localhost:${port}/horsies
          done

      - name: Stop measurement servers
        if: always()
        run: docker compose -f crossclient/fixtures/perf/compose.yaml down -v
