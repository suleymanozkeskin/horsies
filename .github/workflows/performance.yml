  migration-ladder-rung2:
    if: inputs.suite == 'migration-ladder-rung2'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '14'
            service: pg14
            port: 16442
            image: docker.io/library/postgres:14@sha256:c6f9b7243c56553c050bec9a76bb9b9befb15b260ae1e4ac4bf9b56bd99c26a5
          - postgres: '16'
            service: pg16
            port: 16446
            image: docker.io/library/postgres:16@sha256:da8cf245a60506e50a0a8cbb0f39c559ca622d92490605b67fcadc74ca1ea8e4
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Start PostgreSQL ${{ matrix.postgres }} operational server
        run: >-
          docker compose -f tests/fixtures/history/compose.yaml
          up -d --wait ${{ matrix.service }}

      - name: Apply schema
        run: >-
          uv run python -m tests.perf --apply-schema
          --dsn postgresql+psycopg://postgres:testpassword@localhost:${{ matrix.port }}/horsies

      # The step budget is set well above the predicted duration on purpose: a
      # run that exceeds the upper bound must still finish and be judged, since
      # a timeout would report an infrastructure failure where the ladder has
      # an answer.
      - name: Rung 2 — ten million rows
        timeout-minutes: 330
        shell: bash
        run: |
          output_dir=/tmp/migration-ladder-rung2-pg${{ matrix.postgres }}
          mkdir -p "$output_dir"
          output="$output_dir/rung2.json"
          candidate="$output.candidate"
          error_log="$output.stderr"
          set +e
          uv run python -m tests.task_history_prototypes \
            --dsn postgresql+psycopg://postgres:testpassword@localhost:${{ matrix.port }}/horsies \
            --commit '${{ github.sha }}' \
            --run-kind gate \
            --server-image '${{ matrix.image }}' \
            --host-description 'GitHub-hosted ephemeral x86_64 VM; repository application units absent' \
            --storage-description 'GitHub-hosted runner Docker overlay2 storage' \
            --scenario migration-ladder \
            --rows 10000000 \
            --attempts-per-task 1 \
            --batch-size 10000 \
            --next-rung-rows 100000000 \
            --data-path / \
            --demo-quiesced > "$candidate" 2> "$error_log"
          collector_status=$?
          set -e
          if (( collector_status != 0 )); then
            jq -n \
              --arg commit '${{ github.sha }}' \
              --arg postgres_major '${{ matrix.postgres }}' \
              --argjson collector_status "$collector_status" \
              --rawfile error "$error_log" \
              '{
                status: "execution_failure",
                scenario: "migration-ladder",
                rung: 2,
                conditions: {
                  commit: $commit, run_kind: "gate",
                  postgres_major: $postgres_major,
                  durability_mode: "operational"
                },
                workload: {
                  rung_rows: 10000000, attempts_per_task: 1,
                  batch_size: 10000, next_rung_rows: 100000000
                },
                collector_exit_status: $collector_status,
                error: $error
              }' > "$output"
            exit "$collector_status"
          fi
          mv "$candidate" "$output"
          # Which rung ran is asserted from the artifact's own data. The
          # collector is byte-identical to the one that produced rung 1's
          # coefficients, so its rung_verdict and preflight_estimate strings
          # are worded for rung 1; they describe the collector, which computes
          # no verdict, and are not claims about this run.
          jq -e '.workload.rung_rows == 10000000' "$output"
          jq -e '.workload.next_rung_rows == 100000000' "$output"
          jq -e '.workload.attempts_per_task == 1' "$output"
          # Both validated slopes must be present: the amended model judges
          # each independently as well as combined.
          jq -e '.measurement.fitted.coefficients.seconds_per_million_rows' "$output"
          jq -e '.measurement.preparation_seconds_per_million_rows' "$output"
          jq -e '.measurement.fitted.regression_intercept_seconds != null' "$output"
          jq -e '.footprint.fits_same_lane != null' "$output"

      - name: Preserve rung-2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migration-ladder-rung2-pg${{ matrix.postgres }}
          path: /tmp/migration-ladder-rung2-pg${{ matrix.postgres }}/*
          if-no-files-found: error

      - name: Stop PostgreSQL ${{ matrix.postgres }} operational server
        if: always()
        run: docker compose -f tests/fixtures/history/compose.yaml down -v

  operational-maintenance-qualification:
    if: inputs.suite == 'operational-maintenance'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '14'
            service: pg14
            port: 16442
            image: docker.io/library/postgres:14@sha256:c6f9b7243c56553c050bec9a76bb9b9befb15b260ae1e4ac4bf9b56bd99c26a5
          - postgres: '16'
            service: pg16
            port: 16446
            image: docker.io/library/postgres:16@sha256:da8cf245a60506e50a0a8cbb0f39c559ca622d92490605b67fcadc74ca1ea8e4
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Start PostgreSQL ${{ matrix.postgres }} operational server
        run: >-
          docker compose -f tests/fixtures/history/compose.yaml
          up -d --wait ${{ matrix.service }}

      - name: Apply schema
        run: >-
          uv run python -m tests.perf --apply-schema
          --dsn postgresql+psycopg://postgres:testpassword@localhost:${{ matrix.port }}/horsies

      - name: Registry and partition lifecycle qualification
        timeout-minutes: 345
        shell: bash
        run: |
          output_dir=/tmp/task-history-operational-pg${{ matrix.postgres }}
          mkdir -p "$output_dir"
          output="$output_dir/operational.json"
          candidate_output="$output.candidate"
          error_log="$output.stderr"
          exec 3>&1
          set +e
          uv run python -m tests.task_history_prototypes \
            --dsn postgresql+psycopg://postgres:testpassword@localhost:${{ matrix.port }}/horsies \
            --commit '${{ github.sha }}' \
            --run-kind gate \
            --server-image '${{ matrix.image }}' \
            --host-description 'GitHub-hosted ephemeral x86_64 VM; repository application units absent' \
            --storage-description 'GitHub-hosted runner Docker overlay2 storage' \
            --scenario operational-maintenance \
            --rows 1000000 \
            --batch-size 10000 \
            --finite-history-rows 1000000 \
            --forever-history-rows 100000 \
            --attached-finite-leaves 512 \
            --observation-seconds 120 \
            --progress-fd 3 \
            --demo-quiesced > "$candidate_output" 2> "$error_log"
          collector_status=$?
          set -e
          if (( collector_status != 0 )); then
            jq -n \
              --arg commit '${{ github.sha }}' \
              --arg postgres_major '${{ matrix.postgres }}' \
              --arg server_image '${{ matrix.image }}' \
              --argjson collector_status "$collector_status" \
              --rawfile error "$error_log" \
              '{
                status: "execution_failure",
                scenario: "operational-maintenance",
                conditions: {
                  commit: $commit,
                  run_kind: "gate",
                  postgres_major: $postgres_major,
                  server_image: $server_image,
                  demo_quiesced: true,
                  durability_mode: "operational"
                },
                workload: {
                  registry_rows: 1000000,
                  registry_batch_size: 10000,
                  history_rows: 1000000,
                  forever_rows: 100000,
                  attached_leaves: 512,
                  observation_seconds: 120
                },
                collector_exit_status: $collector_status,
                error: $error
              }' > "$output"
            exit "$collector_status"
          fi
          mv "$candidate_output" "$output"
          jq -e '.verdict' "$output"

      - name: Preserve operational evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operational-maintenance-pg${{ matrix.postgres }}
          path: /tmp/task-history-operational-pg${{ matrix.postgres }}/*
          if-no-files-found: error

      - name: Stop PostgreSQL ${{ matrix.postgres }} operational server
        if: always()
        run: docker compose -f tests/fixtures/history/compose.yaml down -v
