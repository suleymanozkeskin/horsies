name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      # Strict pyright over the paths listed in pyrightconfig.clean.json. The
      # list holds files that are clean today, and the type pins.
      - name: Typecheck clean paths
        run: uv run pyright -p pyrightconfig.clean.json

      # Type-check the python blocks of the docs and the skill files. The
      # extractor writes one file per page; blocks marked "check: skip" are
      # left out. See tests/docs_examples/extract.py.
      - name: Typecheck doc examples
        run: |
          uv run python tests/docs_examples/extract.py build/doc_examples
          uv run pyright -p pyrightconfig.docs.json

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

      # The pure tests of the dual-run snapshot: rules, normalize, compare.
      - name: Run dual-run unit tests
        run: uv run pytest tests/dualrun/ -m unit -v --tb=short

  dualrun:
    # The snapshot tests that need PostgreSQL. Each test creates and drops
    # its own dualrun_<32 hex> databases on this server.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run dual-run integration tests
        env:
          DB_PASSWORD: testpassword
        run: uv run pytest tests/dualrun/ -m integration -v --tb=short

  newest-pydantic:
    # The definition check reads core schema keys that pydantic owns, and the
    # dependency has no upper bound. A user can install a newer pydantic than
    # the lock file holds.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies with the newest pydantic
        run: uv sync --dev --upgrade-package pydantic --upgrade-package pydantic-core

      - name: Run the type contract tests
        run: uv run --no-sync pytest tests/unit/test_wire_shape.py tests/unit/test_strict_codec.py tests/unit/test_workflow_node_wire_kwargs.py tests/unit/test_signature_check.py tests/unit/test_type_contract_send_return.py -v --tb=short

  showcase:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect showcase changes
        id: changed
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            base='${{ github.event.before }}'
          fi
          # Same rule as the webui job: an unknown base runs rather than skips.
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- showcase/ horsies/; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs.run == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        run: uv sync --dev

      # No --live: this validates config, imports, every workflow DAG, and each
      # registered builder without a database. It is what keeps the showcase
      # compiling against the library as the library changes, which is why a
      # change under horsies/ also triggers this job.
      - name: Validate showcase app
        if: steps.changed.outputs.run == 'true'
        run: uv run horsies check showcase.acme.app:app

      - name: Typecheck showcase
        if: steps.changed.outputs.run == 'true'
        run: uv run pyright showcase/

  webui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect webui changes
        id: changed
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            base='${{ github.event.before }}'
          fi
          # An unknown base (first push to a branch) runs the job rather than
          # skipping it: a missed check is worse than a redundant one.
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- webui/; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # webui/bun.lock is lockfileVersion 1; pin a stable bun that reads
          # and writes that format so --frozen-lockfile stays meaningful.
          bun-version: "1.3.14"

      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        working-directory: webui
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: steps.changed.outputs.run == 'true'
        working-directory: webui
        run: bun run typecheck

      - name: Run tests
        if: steps.changed.outputs.run == 'true'
        working-directory: webui
        # `bun run test` invokes the vitest script; bare `bun test` would run
        # Bun's own runner against the same files and fail.
        run: bun run test

      - name: Build
        if: steps.changed.outputs.run == 'true'
        working-directory: webui
        run: bun run build

  # PRs into program/0.8.0 change the core and the Python package while the
  # core is merged without compiling (it is built once the Python bridge
  # exists). This job decides which Rust jobs those PRs need, and refuses any
  # change to the frozen Rust client crate. Other events run every job.
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_rust: ${{ steps.decide.outputs.run_rust }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide the Rust jobs and guard the frozen client
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$BASE_REF" != "program/0.8.0" ]; then
            echo 'run_rust=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git merge-base "$BASE_SHA" HEAD)"
          if ! git diff --quiet "$base" HEAD -- crates/horsies/; then
            echo '::error::This PR changes crates/horsies/, the frozen Rust client. It stays unchanged until it is rebuilt on the core.'
            git diff --stat "$base" HEAD -- crates/horsies/
            exit 1
          fi
          if git diff --quiet "$base" HEAD -- crates/horsies-macros/ rust/ Cargo.toml Cargo.lock rust-toolchain.toml rustfmt.toml clippy.toml; then
            echo 'run_rust=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run_rust=true' >> "$GITHUB_OUTPUT"
          fi

  rust-fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
      - name: Check formatting of every crate, the core included
        run: cargo fmt --all --check

  rust:
    needs: scope
    if: needs.scope.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies-rust-port
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # rustup is preinstalled on the runner. With no argument it installs the
      # toolchain and components that rust-toolchain.toml names.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check default features
        run: cargo check --workspace --all-targets --exclude horsies-core --exclude horsies-codegen --exclude horsies-python

      # `web` adds the web module and the `horsies web` CLI.
      - name: Check web feature
        run: cargo check --workspace --all-targets --exclude horsies-core --exclude horsies-codegen --exclude horsies-python --features horsies/web

      # `arbitrary-precision` changes serde_json number handling for the whole
      # build graph.
      - name: Check arbitrary-precision feature
        run: cargo check --workspace --all-targets --exclude horsies-core --exclude horsies-codegen --exclude horsies-python --features horsies/arbitrary-precision

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/horsies-rust-port
        run: cargo test --workspace --exclude horsies-core --exclude horsies-codegen --exclude horsies-python

      # horsies-core, and horsies-codegen and horsies-python, which depend on
      # it, are not built in CI until the first build: the core's work is
      # merged without compiling and is built in one step.

  rust-showcase:
    needs: scope
    if: needs.scope.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect Rust showcase changes
        id: changed
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            base='${{ github.event.before }}'
          fi
          # Same rule as the webui job: an unknown base runs rather than skips.
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- rust/showcase/ crates/ Cargo.toml Cargo.lock rust-toolchain.toml; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Rust toolchain
        if: steps.changed.outputs.run == 'true'
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Cargo builds
        if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Enforce repository-only package
        if: steps.changed.outputs.run == 'true'
        run: grep -Eq '^publish[[:space:]]*=[[:space:]]*false[[:space:]]*$' rust/showcase/Cargo.toml

      - name: Check default features
        if: steps.changed.outputs.run == 'true'
        run: cargo check -p acme-showcase --tests

      - name: Test default features
        if: steps.changed.outputs.run == 'true'
        run: cargo test -p acme-showcase --all-targets

      - name: Check web feature
        if: steps.changed.outputs.run == 'true'
        run: cargo check -p acme-showcase --features web --tests

      - name: Test web feature
        if: steps.changed.outputs.run == 'true'
        run: cargo test -p acme-showcase --features web --all-targets

  rust-webui:
    needs: scope
    if: needs.scope.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect Rust web UI changes
        id: changed
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            base='${{ github.event.before }}'
          fi
          # Same rule as the webui job: an unknown base runs rather than skips.
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- rust/webui/ crates/horsies/webui-dist/ rust/scripts/check-webui-dist.sh; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # The frozen rust/webui/ copy keeps the bun its CI used before the
          # import.
          bun-version: "1.2.23"

      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        working-directory: rust/webui
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: steps.changed.outputs.run == 'true'
        working-directory: rust/webui
        run: bun run typecheck

      - name: Run tests
        if: steps.changed.outputs.run == 'true'
        working-directory: rust/webui
        run: bun run test

      - name: Check design tokens
        if: steps.changed.outputs.run == 'true'
        working-directory: rust/webui
        run: bun run lint:tokens

      # Builds into crates/horsies/webui-dist/ and fails if the committed
      # build differs (rust/scripts/check-webui-dist.sh).
      - name: Check committed build
        if: steps.changed.outputs.run == 'true'
        working-directory: rust/webui
        run: bun run check:dist
