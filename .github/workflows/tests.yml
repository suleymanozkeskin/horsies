name: Unit Tests

on:
  push:
    branches: [main]
  # Pull requests into program/** start no run; a run there is started by hand
  # (workflow_dispatch) when a result is needed.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      record_typecheck_speed:
        description: Record the typecheck-speed baseline of the runner and print baseline.json
        type: boolean
        default: false

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# The Python project is clients/python/. A step that runs uv at the
# repository root uses its pyproject.toml, uv.lock and .venv.
env:
  UV_PROJECT: ${{ github.workspace }}/clients/python
  # The runtimes of the TypeScript jobs, from the minimum runtime lines of the
  # client: Node 26 and Bun 1.4. Bun 1.4.4 wrote clients/typescript/bun.lock.
  # The webui job keeps its own Bun version, for the format of webui/bun.lock.
  TYPESCRIPT_NODE_VERSION: "26.13.1"
  TYPESCRIPT_BUN_VERSION: "1.4.4"

jobs:
  # One dev wheel of horsies, with horsies._core for Linux x86_64, per run.
  # The Python jobs install this wheel and import horsies from it: no job
  # builds the extension again, and no test imports the source folder.
  python-wheel:
    needs: scope
    if: needs.scope.outputs.run_python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # rustup is preinstalled on the runner. With no argument it installs the
      # toolchain and components that rust-toolchain.toml names.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      # The build backend of pyproject.toml (maturin) builds in the release
      # profile unless MATURIN_PEP517_ARGS names another; the dev profile
      # compiles faster and keeps debug assertions and overflow checks on.
      - name: Build the dev wheel
        env:
          MATURIN_PEP517_ARGS: --profile dev
        run: uv build clients/python --wheel --python 3.13 --out-dir dist

      - name: Upload the dev wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: horsies-dev-wheel
          path: dist/horsies-*.whl
          if-no-files-found: error
          retention-days: 7

  unit:
    needs: [scope, python-wheel]
    if: needs.scope.outputs.run_python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Download the dev wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: horsies-dev-wheel
          path: dist

      # The project itself comes from the wheel; every later `uv run` has
      # --no-sync, so uv does not replace it with a build of the source.
      - name: Install dependencies and the dev wheel
        run: |
          uv sync --dev --no-install-project
          uv pip install --python clients/python/.venv --no-deps dist/horsies-*.whl
          # pytest puts clients/python/ first on sys.path, so `import horsies`
          # loads the source folder; give it the compiled module of the wheel.
          unzip -o -j dist/horsies-*.whl 'horsies/_core*.so' -d clients/python/horsies

      # Strict pyright over the paths listed in pyrightconfig.clean.json. The
      # list holds files that are clean today, and the type pins.
      - name: Typecheck clean paths
        run: uv run --no-sync pyright -p clients/python/pyrightconfig.clean.json

      # Type-check the python blocks of the docs and the skill files. The
      # extractor writes one file per page; blocks marked "check: skip" are
      # left out. See clients/python/tests/docs_examples/extract.py.
      - name: Typecheck doc examples
        run: |
          uv run --no-sync python clients/python/tests/docs_examples/extract.py clients/python/build/doc_examples
          uv run --no-sync pyright -p clients/python/pyrightconfig.docs.json

      - name: Run unit tests
        run: uv run --no-sync pytest clients/python/tests/unit/ -v --tb=short

      # The unit tests of the cross-client harnesses in crossclient/:
      # the perf harness, the stored-form vectors and the package root. They
      # run from the repository root with the pytest settings of the Python
      # project.
      - name: Run the unit tests of the cross-client harnesses
        run: uv run --no-sync pytest -c clients/python/pyproject.toml --rootdir . crossclient/perf/ crossclient/test_*.py -v --tb=short

      # The pure tests of the dual-run snapshot: rules, normalize, compare.
      - name: Run dual-run unit tests
        run: uv run --no-sync pytest -c clients/python/pyproject.toml --rootdir . crossclient/parity/snapshot/ -m unit -v --tb=short

      # The public API of the installed wheel against clients/python/tests/public_api/
      # baseline.json and baseline-pyright.json: exports, the deep imports of
      # the docs, the skill files and the showcase, signatures, fields, enum
      # members, the pyright completeness score and diagnostics. An intended
      # change updates the baseline with `python -m tests.public_api.runner`.
      - name: Compare the public API with the baseline
        run: uv run --no-sync pytest clients/python/tests/public_api/ -v --tb=short

  dualrun:
    needs: [scope, python-wheel]
    if: needs.scope.outputs.run_python == 'true'
    # The snapshot tests that need PostgreSQL. Each test creates and drops
    # its own dualrun_<32 hex> databases on this server.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Download the dev wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: horsies-dev-wheel
          path: dist

      # The project itself comes from the wheel; every later `uv run` has
      # --no-sync, so uv does not replace it with a build of the source.
      - name: Install dependencies and the dev wheel
        run: |
          uv sync --dev --no-install-project
          uv pip install --python clients/python/.venv --no-deps dist/horsies-*.whl
          # pytest puts clients/python/ first on sys.path, so `import horsies`
          # loads the source folder; give it the compiled module of the wheel.
          unzip -o -j dist/horsies-*.whl 'horsies/_core*.so' -d clients/python/horsies

      - name: Run dual-run integration tests
        env:
          DB_PASSWORD: testpassword
        run: uv run --no-sync pytest -c clients/python/pyproject.toml --rootdir . crossclient/parity/snapshot/ -m integration -v --tb=short

  extension:
    needs: [scope, python-wheel]
    if: needs.scope.outputs.run_python == 'true'
    # The tests of horsies._core itself, each case in a fresh interpreter
    # (clients/python/tests/extension/). Most cases connect: the session database of
    # clients/python/tests/session_database.py, with the schema that
    # CoreHandle.install_schema installs. The uvloop cases need uvloop from
    # the dev group.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Download the dev wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: horsies-dev-wheel
          path: dist

      # The project itself comes from the wheel; every later `uv run` has
      # --no-sync, so uv does not replace it with a build of the source.
      - name: Install dependencies and the dev wheel
        run: |
          uv sync --dev --no-install-project
          uv pip install --python clients/python/.venv --no-deps dist/horsies-*.whl
          # pytest puts clients/python/ first on sys.path, so `import horsies`
          # loads the source folder; give it the compiled module of the wheel.
          unzip -o -j dist/horsies-*.whl 'horsies/_core*.so' -d clients/python/horsies

      - name: Run the extension module tests
        env:
          DB_PASSWORD: testpassword
        run: uv run --no-sync pytest clients/python/tests/extension/ -v --tb=short

  newest-pydantic:
    needs: [scope, python-wheel]
    if: needs.scope.outputs.run_python == 'true'
    # The definition check reads core schema keys that pydantic owns, and the
    # dependency has no upper bound. A user can install a newer pydantic than
    # the lock file holds.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Download the dev wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: horsies-dev-wheel
          path: dist

      - name: Install dependencies with the newest pydantic, and the dev wheel
        run: |
          uv sync --dev --no-install-project --upgrade-package pydantic --upgrade-package pydantic-core
          uv pip install --python clients/python/.venv --no-deps dist/horsies-*.whl
          # pytest puts clients/python/ first on sys.path, so `import horsies`
          # loads the source folder; give it the compiled module of the wheel.
          unzip -o -j dist/horsies-*.whl 'horsies/_core*.so' -d clients/python/horsies

      - name: Run the type contract tests
        run: uv run --no-sync pytest clients/python/tests/unit/test_wire_shape.py clients/python/tests/unit/test_strict_codec.py clients/python/tests/unit/test_workflow_node_wire_kwargs.py clients/python/tests/unit/test_signature_check.py clients/python/tests/unit/test_type_contract_send_return.py -v --tb=short

  showcase:
    needs: [scope, python-wheel]
    if: needs.scope.outputs.run_python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect showcase changes
        id: changed
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            base='${{ github.event.before }}'
          fi
          # Same rule as the webui job: an unknown base runs rather than skips.
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- clients/python/examples/ clients/python/horsies/ clients/python/bridge/ core/ core/derive/ Cargo.toml Cargo.lock rust-toolchain.toml; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs.run == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Download the dev wheel
        if: steps.changed.outputs.run == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: horsies-dev-wheel
          path: dist

      - name: Install dependencies and the dev wheel
        if: steps.changed.outputs.run == 'true'
        run: |
          uv sync --dev --no-install-project
          uv pip install --python clients/python/.venv --no-deps dist/horsies-*.whl
          # pytest puts clients/python/ first on sys.path, so `import horsies`
          # loads the source folder; give it the compiled module of the wheel.
          unzip -o -j dist/horsies-*.whl 'horsies/_core*.so' -d clients/python/horsies

      # No --live: this validates config, imports, every workflow DAG, and each
      # registered builder without a database. It is what keeps the showcase
      # compiling against the library as the library changes, which is why a
      # change to clients/python/horsies/ or to the crates of horsies._core also
      # triggers this job.
      - name: Validate showcase app
        if: steps.changed.outputs.run == 'true'
        working-directory: clients/python
        run: uv run --no-sync horsies check examples.acme.app:app

      - name: Typecheck showcase
        if: steps.changed.outputs.run == 'true'
        working-directory: clients/python
        run: uv run --no-sync pyright examples/

  webui:
    needs: scope
    if: needs.scope.outputs.run_python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect webui changes
        id: changed
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            base='${{ github.event.before }}'
          fi
          # An unknown base (first push to a branch) runs the job rather than
          # skipping it: a missed check is worse than a redundant one. A change
          # to the core's committed build alone also runs it, for the check of
          # that build below.
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- webui/ core/webui-dist/; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # webui/bun.lock is lockfileVersion 1; pin a stable bun that reads
          # and writes that format so --frozen-lockfile stays meaningful.
          bun-version: "1.3.14"

      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        working-directory: webui
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: steps.changed.outputs.run == 'true'
        working-directory: webui
        run: bun run typecheck

      - name: Run tests
        if: steps.changed.outputs.run == 'true'
        working-directory: webui
        # `bun run test` invokes the vitest script; bare `bun test` would run
        # Bun's own runner against the same files and fail.
        run: bun run test

      - name: Build
        if: steps.changed.outputs.run == 'true'
        working-directory: webui
        run: bun run build

      # Builds into core/webui-dist/, which horsies-core embeds,
      # and fails if the committed build differs (webui/scripts/check-core-dist.sh).
      - name: Check the core's committed build
        if: steps.changed.outputs.run == 'true'
        working-directory: webui
        run: bun run check:core-dist

  # A PR into program/0.8.0 runs only the Rust, Python and generated-files
  # jobs that its paths need. A PR into any branch runs the TypeScript jobs
  # only when its paths need them. Other events run every job.
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_rust: ${{ steps.decide.outputs.run_rust }}
      run_python: ${{ steps.decide.outputs.run_python }}
      run_generated: ${{ steps.decide.outputs.run_generated }}
      run_typescript: ${{ steps.decide_typescript.outputs.run_typescript }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # The TypeScript client loads an addon that is built from the core, and
      # its parity side runs in crossclient/parity/. This file holds the
      # TypeScript jobs and their runtime versions.
      - name: Decide the TypeScript jobs
        id: decide_typescript
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo 'run_typescript=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git merge-base "$BASE_SHA" HEAD)"
          if git diff --quiet "$base" HEAD -- clients/typescript/ core/ core/derive/ website/src/content/docs/typescript/ crossclient/parity/ Cargo.toml Cargo.lock rust-toolchain.toml .github/workflows/tests.yml; then
            echo 'run_typescript=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run_typescript=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Decide the Rust, Python and generated-files jobs
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$BASE_REF" != "program/0.8.0" ]; then
            echo 'run_rust=true' >> "$GITHUB_OUTPUT"
            echo 'run_python=true' >> "$GITHUB_OUTPUT"
            echo 'run_generated=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git merge-base "$BASE_SHA" HEAD)"
          # The rust job checks and tests every crate of the workspace.
          # The Rust pages of the docs site hold the code blocks that
          # horsies-docs-check builds.
          if git diff --quiet "$base" HEAD -- core/ clients/rust/ clients/python/bridge/ clients/python/codegen/ website/src/content/docs/rust/ Cargo.toml Cargo.lock rust-toolchain.toml rustfmt.toml clippy.toml; then
            echo 'run_rust=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run_rust=true' >> "$GITHUB_OUTPUT"
          fi
          # The generator renders the catalogs and the stubs from horsies-core
          # (which derives its catalogs with horsies-core-derive). A change to
          # an input or to a committed output can make a committed file stale.
          if git diff --quiet "$base" HEAD -- core/ core/derive/ clients/python/codegen/ clients/python/horsies/_catalog/ clients/python/horsies/_core.pyi Cargo.toml Cargo.lock rust-toolchain.toml; then
            echo 'run_generated=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run_generated=true' >> "$GITHUB_OUTPUT"
          fi
          # horsies._core is built from clients/python/bridge, core and
          # core/derive with the root Cargo and toolchain files, so a change
          # there can change a Python result. A PR that changes only the Rust
          # client (clients/rust/), the generator, or the format and lint
          # settings cannot: the Python jobs are skipped for it.
          if git diff --quiet "$base" HEAD -- . ':(exclude)clients/rust/' ':(exclude)clients/python/codegen/' ':(exclude)rustfmt.toml' ':(exclude)clippy.toml'; then
            echo 'run_python=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run_python=true' >> "$GITHUB_OUTPUT"
          fi

  rust-fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
      - name: Check formatting of every crate, the core included
        run: cargo fmt --all --check

  # Every crate of the workspace. The check leaves out horsies-test-worker
  # (clients/rust/tests/worker/): its workflow tests still use the API of the old
  # Rust client and move to the client of the core with #1410.
  rust:
    needs: scope
    if: needs.scope.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # rustup is preinstalled on the runner. With no argument it installs the
      # toolchain and components that rust-toolchain.toml names.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      # horsies-python enables PyO3's `abi3-py313` feature, so its build script
      # needs a Python 3.13 interpreter; the runner's python3 is older.
      # `cargo test -p horsies-python` links libpython (the `extension-module`
      # feature is on only in the wheel build). This Python ships the shared
      # library, and the action puts its folder on LD_LIBRARY_PATH.
      - name: Install Python 3.13 for PyO3
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Point PyO3 at Python 3.13
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: echo "PYO3_PYTHON=$PYTHON_PATH" >> "$GITHUB_ENV"

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Cargo unifies the features of the checked crates: horsies-python turns
      # on the `web` feature of horsies-core here.
      # horsies-arbitrary-precision-tests would turn on serde_json's
      # arbitrary_precision for every crate; tests-full.yml builds it alone.
      - name: Check the workspace
        run: cargo check --workspace --all-targets --exclude horsies-test-worker --exclude horsies-docs-check --exclude horsies-arbitrary-precision-tests

      # Clippy on every crate, every target and every feature; a finding
      # fails the job. The lint levels: [workspace.lints] of Cargo.toml.
      - name: Lint the workspace with clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Every `rust` block of website/src/content/docs/rust/ and of the Rust
      # skill files, as a module of the crate; the error names the page.
      # The block markers: clients/rust/tests/docs-check/src/lib.rs.
      - name: Build the Rust code blocks of the docs and the skill files
        run: cargo check -p horsies-docs-check --all-targets

      - name: Check the core without the web feature
        run: cargo check -p horsies-core --all-targets

      # Each feature of the client has code of its own: `cli` (the default)
      # holds horsies::cli::run and the shipped binary, `web` the axum mount,
      # `tokio-postgres` and `sqlx` the rerun adapters, `otel` the
      # OpenTelemetry spans and producer metrics.
      - name: Check the client with default features
        run: cargo check -p horsies --all-targets

      - name: Check the client with the web feature
        run: cargo check -p horsies --all-targets --features web

      - name: Check the client with the tokio-postgres feature
        run: cargo check -p horsies --all-targets --features tokio-postgres

      - name: Check the client with the sqlx feature
        run: cargo check -p horsies --all-targets --features sqlx

      # `otel` without `cli`: the spans and metrics need no CLI runner.
      - name: Check the client with the otel feature and no default features
        run: cargo check -p horsies --all-targets --no-default-features --features otel

      - name: Check the client with no default features
        run: cargo check -p horsies --all-targets --no-default-features

      - name: Build the examples
        run: cargo build -p horsies-examples --examples

      # The compile-pass and compile-fail cases of the task attributes and
      # derives of the Rust client (trybuild).
      - name: Test the macros
        run: cargo test -p horsies-macros

      # The derives of the core's code catalogs and manifest types.
      - name: Test the core derives
        run: cargo test -p horsies-core-derive

      # The core tests run in parallel, and one of them holds 66 sessions at
      # once (core/src/sql_tests/baseline_key_reservation_claim.rs). The
      # image's max_connections of 100 refuses some of them (SQLSTATE 53300).
      # ALTER SYSTEM takes effect at the restart.
      - name: Raise max_connections of the test server to 300
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -c "ALTER SYSTEM SET max_connections = 300"
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -q; then
              docker exec "$POSTGRES_CONTAINER" psql -U postgres -Atc "SHOW max_connections"
              exit 0
            fi
            sleep 1
          done
          echo "the test server accepts no connection 30 s after its restart" >&2
          exit 1

      # The core's tests create one database per test, copied from a
      # template that each test process installs, on the server of
      # DATABASE_URL (core/src/test_support/database.rs).
      - name: Create the core test database
        run: docker exec ${{ job.services.postgres.id }} createdb -U postgres horsies-core

      # The `web` feature adds the monitoring handler and its tests; no core
      # test needs the feature off.
      - name: Test the core
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/horsies-core
        run: cargo test -p horsies-core --features web

      - name: Test the extension module crate
        run: cargo test -p horsies-python

      - name: Test the generator
        run: cargo test -p horsies-codegen

      # Without `web`, `horsies web` refuses with its message; that test runs
      # only in this run.
      - name: Test the client with default features
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/horsies
        run: cargo test -p horsies

      # The rerun adapters and the carrier of a traced send run against the
      # server of DATABASE_URL.
      - name: Test the client with every feature
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/horsies
        run: cargo test -p horsies --features web,tokio-postgres,sqlx,otel

  # horsies-codegen renders the catalog modules under clients/python/horsies/_catalog/
  # and the stubs clients/python/horsies/_core.pyi from horsies-core; the rendered
  # files are committed. This job renders them again and fails when a
  # committed file differs, is missing, or is a retired generated file. The
  # fix is `cargo run -p horsies-codegen -- write clients/python/horsies`.
  generated-files:
    needs: scope
    if: needs.scope.outputs.run_generated == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check the generated Python files
        run: cargo run -p horsies-codegen -- check clients/python/horsies

  rust-showcase:
    needs: scope
    if: needs.scope.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect Rust showcase changes
        id: changed
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            base='${{ github.event.before }}'
          fi
          # Same rule as the webui job: an unknown base runs rather than skips.
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- clients/rust/examples/showcase/ core/ clients/python/bridge/ clients/python/codegen/ clients/rust/horsies/ clients/rust/macros/ Cargo.toml Cargo.lock rust-toolchain.toml; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Rust toolchain
        if: steps.changed.outputs.run == 'true'
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Cargo builds
        if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Enforce repository-only package
        if: steps.changed.outputs.run == 'true'
        run: grep -Eq '^publish[[:space:]]*=[[:space:]]*false[[:space:]]*$' clients/rust/examples/showcase/Cargo.toml

      - name: Check default features
        if: steps.changed.outputs.run == 'true'
        run: cargo check -p acme-showcase --tests

      - name: Test default features
        if: steps.changed.outputs.run == 'true'
        run: cargo test -p acme-showcase --all-targets

      - name: Check web feature
        if: steps.changed.outputs.run == 'true'
        run: cargo check -p acme-showcase --features web --tests

      - name: Test web feature
        if: steps.changed.outputs.run == 'true'
        run: cargo test -p acme-showcase --features web --all-targets

  # The TypeScript client (clients/typescript/) on Node 26 and Bun 1.4. The
  # steps are in clients/typescript/ci/unit.sh; the ts-unit job of
  # tests-full.yml runs the same script.
  typescript:
    needs: scope
    if: needs.scope.outputs.run_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # No npm step runs, so the action caches no npm folder.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.TYPESCRIPT_NODE_VERSION }}
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.TYPESCRIPT_BUN_VERSION }}

      - name: Run the checks of the TypeScript client
        run: clients/typescript/ci/unit.sh

  # The typecheck-speed check of the TypeScript client
  # (clients/typescript/tests/typecheck-speed/). The statistic is the ratio of
  # the typecheck time of the app project to that of the control project,
  # measured in the same session, so the verdict does not depend on the
  # runner speed. The ratio still differs per operating system and CPU
  # architecture, so baseline.json holds one ratio and its noise per
  # platform, architecture and Bun binary. The step exits 1 when the ratio
  # is above the baseline median plus the noise, and 2 when no baseline
  # matches this platform, architecture and Bun binary.
  typescript-typecheck-speed:
    needs: scope
    if: needs.scope.outputs.run_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.TYPESCRIPT_BUN_VERSION }}

      # The app project type-checks against the source of the package, so the
      # step installs the workspace (the Node types).
      - name: Install the workspace from bun.lock
        working-directory: clients/typescript
        run: bun install --frozen-lockfile

      # Only on a dispatch with record_typecheck_speed: the record command
      # measures 5 sessions on this runner, writes its entry into
      # baseline.json, and the step prints the file. The file is not kept;
      # a commit adds the printed entry. The check below then compares with
      # the entry of this run.
      - name: Record the typecheck-speed baseline of this runner
        if: inputs.record_typecheck_speed
        working-directory: clients/typescript
        run: |
          bun run typecheck-speed:record
          cat tests/typecheck-speed/baseline.json

      - name: Check the typecheck speed (ratio to the control project)
        working-directory: clients/typescript
        run: bun run typecheck-speed

  # The dev addon of the TypeScript client for linux-x64-gnu, built once per
  # run, and its native tests on Node and on Bun against PostgreSQL 18. The
  # jobs typescript-e2e and typescript-parity download the file that this job
  # uploads: no job builds the addon twice in one run.
  typescript-addon:
    needs: scope
    if: needs.scope.outputs.run_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      HORSIES_TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/horsies
      HORSIES_NATIVE_ADDON_PATH: ${{ github.workspace }}/clients/typescript/bridge/horsies.linux-x64-gnu.node
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.TYPESCRIPT_NODE_VERSION }}
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.TYPESCRIPT_BUN_VERSION }}

      # rustup is preinstalled on the runner. With no argument it installs the
      # toolchain and components that rust-toolchain.toml names.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The napi CLI of clients/typescript/bridge/package.json.
      - name: Install the workspace from bun.lock
        working-directory: clients/typescript
        run: bun install --frozen-lockfile

      - name: Build the dev addon
        run: bun run --cwd clients/typescript/bridge build:dev

      # The generated index.d.ts that the build writes, type-checked against
      # the declarations of tests/native-declarations. The step reports its
      # failure without failing the job, because the jobs that need this job
      # (the end-to-end, PgBouncer, parity and examples lanes) do not start
      # after a failed job. The program head has 12 errors in
      # facades-monitoring.ts, which another change fixes; remove
      # continue-on-error when that change is merged.
      - name: Check the declarations of the dev addon
        continue-on-error: true
        run: bun run --cwd clients/typescript/bridge check:declarations

      - name: Upload the dev addon
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typescript-dev-addon
          path: clients/typescript/bridge/horsies.linux-x64-gnu.node
          if-no-files-found: error
          retention-days: 7

      # Each runtime runs the native tests on its own new, empty database:
      # the tests of one runtime never see the rows of the other.
      - name: Create one empty database per runtime
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE horsies_native_bun'
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE horsies_native_node'

      - name: Run the native tests on Bun
        env:
          HORSIES_TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/horsies_native_bun
        run: bun run --cwd clients/typescript/bridge test:native

      - name: Run the native tests on Node
        env:
          HORSIES_TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/horsies_native_node
        run: bun run --cwd clients/typescript/bridge test:native:node

  # The generated files of the TypeScript client: the renderer check reports
  # drift between the committed files and the core, and the crate tests run
  # the renderer's own tests.
  typescript-codegen:
    needs: scope
    if: needs.scope.outputs.run_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check the generated TypeScript files
        run: |
          if ! cargo run -p horsies-typescript-codegen -- check clients/typescript/horsies; then
            echo '::error::The generated TypeScript files differ from the core. To write them, run: cargo run -p horsies-typescript-codegen -- write clients/typescript/horsies' >&2
            exit 1
          fi

      - name: Test the codegen crate
        run: cargo test -p horsies-typescript-codegen

  # The end-to-end layers of the TypeScript client on Node and on Bun, through
  # the built package: the job builds `horsies` (tsconfig.build.json) and the
  # platform package, installs both into the workspace's node_modules
  # (tests/e2e/install-built-package.ts), and the layers import `horsies`
  # through its `exports` map (HORSIES_E2E_ENTRY=package; the published loader
  # reads no addon path variable). The addon file is the dev addon of
  # typescript-addon, because the layers use its test exports. PostgreSQL 18.
  # The runner (tests/e2e/run.ts) runs each layer file under its watchdog.
  typescript-e2e:
    name: typescript-e2e (${{ matrix.runtime }})
    needs: [scope, typescript-addon]
    if: needs.scope.outputs.run_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    env:
      HORSIES_TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/horsies
      HORSIES_E2E_ENTRY: package
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.TYPESCRIPT_NODE_VERSION }}
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.TYPESCRIPT_BUN_VERSION }}

      - name: Download the dev addon
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: typescript-dev-addon
          path: clients/typescript/bridge

      - name: Install the workspace from bun.lock
        working-directory: clients/typescript
        run: bun install --frozen-lockfile

      - name: Build and install the horsies package and the platform package
        working-directory: clients/typescript
        run: bun tests/e2e/install-built-package.ts --platform linux-x64-gnu --addon "$GITHUB_WORKSPACE/clients/typescript/bridge/horsies.linux-x64-gnu.node"

      - name: Run the end-to-end layers
        working-directory: clients/typescript
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: bun tests/e2e/run.ts "$RUNTIME"

  # The end-to-end layers through the PgBouncer fixture of the Python client
  # (clients/python/tests/fixtures/pgbouncer/: PostgreSQL 18 on 15432, pools
  # in transaction, session and statement mode), on Node and on Bun, with the
  # built package as in typescript-e2e. The test server is the direct URL; the
  # apps connect through the transaction pool
  # (HORSIES_TEST_DATABASE_URL_TRANSACTION, tests/e2e/support/database.ts).
  typescript-pgbouncer:
    name: typescript-pgbouncer (${{ matrix.runtime }})
    needs: [scope, typescript-addon]
    if: needs.scope.outputs.run_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    env:
      HORSIES_TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:15432/horsies
      HORSIES_TEST_DATABASE_URL_TRANSACTION: postgresql://postgres:testpassword@localhost:16432/horsies
      HORSIES_E2E_ENTRY: package
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.TYPESCRIPT_NODE_VERSION }}
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.TYPESCRIPT_BUN_VERSION }}

      - name: Start PgBouncer fixture stack
        run: docker compose -f clients/python/tests/fixtures/pgbouncer/compose.yaml up -d --wait

      - name: Download the dev addon
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: typescript-dev-addon
          path: clients/typescript/bridge

      - name: Install the workspace from bun.lock
        working-directory: clients/typescript
        run: bun install --frozen-lockfile

      - name: Build and install the horsies package and the platform package
        working-directory: clients/typescript
        run: bun tests/e2e/install-built-package.ts --platform linux-x64-gnu --addon "$GITHUB_WORKSPACE/clients/typescript/bridge/horsies.linux-x64-gnu.node"

      - name: Run the end-to-end layers through the transaction pool
        working-directory: clients/typescript
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: bun tests/e2e/run.ts "$RUNTIME"

      - name: Stop PgBouncer fixture stack
        if: always()
        run: docker compose -f clients/python/tests/fixtures/pgbouncer/compose.yaml down -v

  # The examples and the showcase on Node and on Bun, each run against a
  # throwaway database of PostgreSQL 18: the demo of each example with a
  # worker of its profile (ci/examples.sh), and the schedule test of the
  # showcase (tests/scheduler.test.ts). Each process runs with the dev start
  # module (examples/dev/source-package.ts) and the dev addon of
  # typescript-addon.
  typescript-examples:
    name: typescript-examples (${{ matrix.runtime }})
    needs: [scope, typescript-addon]
    if: needs.scope.outputs.run_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    env:
      HORSIES_NATIVE_ADDON_PATH: ${{ github.workspace }}/clients/typescript/bridge/horsies.linux-x64-gnu.node
      EXAMPLES_DATABASE_SERVER: postgresql://postgres:testpassword@localhost:5432
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.TYPESCRIPT_NODE_VERSION }}
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.TYPESCRIPT_BUN_VERSION }}

      - name: Download the dev addon
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: typescript-dev-addon
          path: clients/typescript/bridge

      - name: Install the workspace from bun.lock
        working-directory: clients/typescript
        run: bun install --frozen-lockfile

      - name: Run the demo of each example
        working-directory: clients/typescript
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: ci/examples.sh "$RUNTIME"

      - name: Create the database of the showcase schedule test
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: docker exec "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE showcase_schedule_$RUNTIME"

      - name: Run the schedule test of the showcase
        working-directory: clients/typescript/examples/showcase
        env:
          RUNTIME: ${{ matrix.runtime }}
          ACME_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/showcase_schedule_${{ matrix.runtime }}
        run: scripts/test.sh "$RUNTIME" tests/scheduler.test.ts

  # The parity of the TypeScript client with the Python client
  # (crossclient/parity): the compare tests, then each scenario on the Python
  # side and on the TypeScript side (Node and Bun), each on its own new
  # database. The Python side needs horsies._core, so the job installs the
  # dev wheel of python-wheel. The Rust side is not built: rust-e2e of
  # tests-full.yml runs the Rust pairs.
  typescript-parity:
    needs: [scope, python-wheel, typescript-addon]
    if: needs.scope.outputs.run_typescript == 'true' && needs.scope.outputs.run_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      HORSIES_TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/horsies
      HORSIES_NATIVE_ADDON_PATH: ${{ github.workspace }}/clients/typescript/bridge/horsies.linux-x64-gnu.node
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.TYPESCRIPT_NODE_VERSION }}
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.TYPESCRIPT_BUN_VERSION }}

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Download the dev addon
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: typescript-dev-addon
          path: clients/typescript/bridge

      - name: Download the dev wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: horsies-dev-wheel
          path: dist

      - name: Install the workspace from bun.lock
        working-directory: clients/typescript
        run: bun install --frozen-lockfile

      # The project itself comes from the wheel; every later `uv run` has
      # --no-sync, so uv does not replace it with a build of the source.
      - name: Install the Python dependencies and the dev wheel
        run: |
          uv sync --dev --no-install-project
          uv pip install --python clients/python/.venv --no-deps dist/horsies-*.whl
          # pytest puts clients/python/ first on sys.path, so `import horsies`
          # loads the source folder; give it the compiled module of the wheel.
          unzip -o -j dist/horsies-*.whl 'horsies/_core*.so' -d clients/python/horsies

      - name: Run the compare tests
        run: uv run --no-sync pytest -c clients/python/pyproject.toml --rootdir . crossclient/parity/test_compare_sides.py -v --tb=short

      - name: Run the TypeScript parity scenarios
        run: uv run --no-sync pytest -c clients/python/pyproject.toml --rootdir . crossclient/parity/test_parity.py -k typescript -v --tb=short

  # The zod adapter of the TypeScript client on the newest patch of each zod
  # minor of the supported range (the peer range of horsies/package.json,
  # SUPPORTED_ZOD in horsies/src/zod/version.ts: >=4.1.13 <4.7.0). A row is
  # added when the range gains a minor. The runner of the type tests
  # (tests/types/run.ts) has no case filter, so the step runs every case,
  # the zod-* compile-fail cases among them.
  typescript-zod-minors:
    name: typescript-zod-minors (zod ${{ matrix.zod }})
    needs: scope
    if: needs.scope.outputs.run_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        zod: ['4.1.13', '4.2.1', '4.3.6', '4.4.3', '4.5.4', '4.6.7']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.TYPESCRIPT_NODE_VERSION }}
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.TYPESCRIPT_BUN_VERSION }}

      # The packages that pin zod (tests, horsies, examples, examples/showcase)
      # pin it in the `zod` entry of their dev dependencies; the peer range is
      # not an exact pin and stays. The install is not frozen: bun.lock
      # changes in this job only.
      - name: Install the workspace and the floor compiler
        working-directory: clients/typescript
        env:
          ZOD_VERSION: ${{ matrix.zod }}
        run: |
          set -euo pipefail
          for package_file in tests/package.json horsies/package.json examples/package.json examples/showcase/package.json; do
            grep -q '"zod": "4.1.13"' "$package_file"
            sed -i "s/\"zod\": \"4.1.13\"/\"zod\": \"$ZOD_VERSION\"/" "$package_file"
          done
          bun install
          (cd ci/typescript-floor && bun install --frozen-lockfile)
          for package_folder in tests horsies; do
            installed="$(cd "$package_folder" && node -p "require(require.resolve('zod/package.json')).version")"
            test "$installed" = "$ZOD_VERSION"
          done

      - name: Type check with bun check
        working-directory: clients/typescript
        run: bun check

      - name: Run the zod tests on Bun
        working-directory: clients/typescript
        run: bun test tests/unit/zod

      - name: Run the zod tests on Node
        working-directory: clients/typescript
        run: node --test 'tests/unit/zod/**/*.test.ts'

      - name: Run the type tests
        working-directory: clients/typescript
        run: bun tests/types/run.ts
