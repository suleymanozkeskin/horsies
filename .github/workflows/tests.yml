name: Unit Tests

on:
  push:
    branches: [main]
  # Pull requests into program/** start no run; a run there is started by hand
  # (workflow_dispatch) when a result is needed.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  unit:
    needs: scope
    if: needs.scope.outputs.run_python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      # Strict pyright over the paths listed in pyrightconfig.clean.json. The
      # list holds files that are clean today, and the type pins.
      - name: Typecheck clean paths
        run: uv run pyright -p pyrightconfig.clean.json

      # Type-check the python blocks of the docs and the skill files. The
      # extractor writes one file per page; blocks marked "check: skip" are
      # left out. See tests/docs_examples/extract.py.
      - name: Typecheck doc examples
        run: |
          uv run python tests/docs_examples/extract.py build/doc_examples
          uv run pyright -p pyrightconfig.docs.json

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

      # The pure tests of the dual-run snapshot: rules, normalize, compare.
      - name: Run dual-run unit tests
        run: uv run pytest tests/dualrun/ -m unit -v --tb=short

  dualrun:
    needs: scope
    if: needs.scope.outputs.run_python == 'true'
    # The snapshot tests that need PostgreSQL. Each test creates and drops
    # its own dualrun_<32 hex> databases on this server.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run dual-run integration tests
        env:
          DB_PASSWORD: testpassword
        run: uv run pytest tests/dualrun/ -m integration -v --tb=short

  newest-pydantic:
    needs: scope
    if: needs.scope.outputs.run_python == 'true'
    # The definition check reads core schema keys that pydantic owns, and the
    # dependency has no upper bound. A user can install a newer pydantic than
    # the lock file holds.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies with the newest pydantic
        run: uv sync --dev --upgrade-package pydantic --upgrade-package pydantic-core

      - name: Run the type contract tests
        run: uv run --no-sync pytest tests/unit/test_wire_shape.py tests/unit/test_strict_codec.py tests/unit/test_workflow_node_wire_kwargs.py tests/unit/test_signature_check.py tests/unit/test_type_contract_send_return.py -v --tb=short

  showcase:
    needs: scope
    if: needs.scope.outputs.run_python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect showcase changes
        id: changed
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            base='${{ github.event.before }}'
          fi
          # Same rule as the webui job: an unknown base runs rather than skips.
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- showcase/ python/horsies/ crates/horsies-python/ crates/horsies-core/ crates/horsies-macros/ Cargo.toml Cargo.lock rust-toolchain.toml; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs.run == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        run: uv sync --dev

      # No --live: this validates config, imports, every workflow DAG, and each
      # registered builder without a database. It is what keeps the showcase
      # compiling against the library as the library changes, which is why a
      # change to python/horsies/ or to the crates of horsies._core also
      # triggers this job.
      - name: Validate showcase app
        if: steps.changed.outputs.run == 'true'
        run: uv run horsies check showcase.acme.app:app

      - name: Typecheck showcase
        if: steps.changed.outputs.run == 'true'
        run: uv run pyright showcase/

  webui:
    needs: scope
    if: needs.scope.outputs.run_python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect webui changes
        id: changed
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            base='${{ github.event.before }}'
          fi
          # An unknown base (first push to a branch) runs the job rather than
          # skipping it: a missed check is worse than a redundant one. A change
          # to the core's committed build alone also runs it, for the check of
          # that build below.
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- webui/ crates/horsies-core/webui-dist/; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # webui/bun.lock is lockfileVersion 1; pin a stable bun that reads
          # and writes that format so --frozen-lockfile stays meaningful.
          bun-version: "1.3.14"

      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        working-directory: webui
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: steps.changed.outputs.run == 'true'
        working-directory: webui
        run: bun run typecheck

      - name: Run tests
        if: steps.changed.outputs.run == 'true'
        working-directory: webui
        # `bun run test` invokes the vitest script; bare `bun test` would run
        # Bun's own runner against the same files and fail.
        run: bun run test

      - name: Build
        if: steps.changed.outputs.run == 'true'
        working-directory: webui
        run: bun run build

      # Builds into crates/horsies-core/webui-dist/, which horsies-core embeds,
      # and fails if the committed build differs (webui/scripts/check-core-dist.sh).
      - name: Check the core's committed build
        if: steps.changed.outputs.run == 'true'
        working-directory: webui
        run: bun run check:core-dist

  # A PR into program/0.8.0 runs only the jobs that its paths need. Other
  # events run every job.
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_rust: ${{ steps.decide.outputs.run_rust }}
      run_python: ${{ steps.decide.outputs.run_python }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide the Rust and Python jobs
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$BASE_REF" != "program/0.8.0" ]; then
            echo 'run_rust=true' >> "$GITHUB_OUTPUT"
            echo 'run_python=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git merge-base "$BASE_SHA" HEAD)"
          # The Rust client builds on the core and the macros.
          if git diff --quiet "$base" HEAD -- crates/horsies/ crates/horsies-core/ crates/horsies-macros/ rust/ Cargo.toml Cargo.lock rust-toolchain.toml rustfmt.toml clippy.toml; then
            echo 'run_rust=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run_rust=true' >> "$GITHUB_OUTPUT"
          fi
          # horsies._core is built from crates/horsies-python, crates/horsies-core
          # and crates/horsies-macros with the root Cargo and toolchain files, so
          # a change there can change a Python result. A PR that changes only the
          # Rust client, the generator, rust/, or the format and lint settings
          # cannot: the Python jobs are skipped for it.
          if git diff --quiet "$base" HEAD -- . ':(exclude)crates/horsies/' ':(exclude)crates/horsies-codegen/' ':(exclude)rust/' ':(exclude)rustfmt.toml' ':(exclude)clippy.toml'; then
            echo 'run_python=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run_python=true' >> "$GITHUB_OUTPUT"
          fi

  rust-fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
      - name: Check formatting of every crate, the core included
        run: cargo fmt --all --check

  # The Rust client (crates/horsies), its macros and the examples. The
  # end-to-end crates under rust/tests/ and the core's own tests are not run
  # here: rust/tests/ moves to the client of the core with #1410, and the core
  # jobs are turned on with #846.
  rust:
    needs: scope
    if: needs.scope.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # rustup is preinstalled on the runner. With no argument it installs the
      # toolchain and components that rust-toolchain.toml names.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Each feature of the client has code of its own: `cli` (the default)
      # holds horsies::cli::run and the shipped binary, `web` the axum mount,
      # `tokio-postgres` and `sqlx` the rerun adapters.
      - name: Check the client with default features
        run: cargo check -p horsies --all-targets

      - name: Check the client with the web feature
        run: cargo check -p horsies --all-targets --features web

      - name: Check the client with the tokio-postgres feature
        run: cargo check -p horsies --all-targets --features tokio-postgres

      - name: Check the client with the sqlx feature
        run: cargo check -p horsies --all-targets --features sqlx

      - name: Check the client with no default features
        run: cargo check -p horsies --all-targets --no-default-features

      - name: Build the examples
        run: cargo build -p horsies-examples --examples

      # The compile-pass and compile-fail cases of the task attributes and
      # derives (trybuild).
      - name: Test the macros
        run: cargo test -p horsies-macros

      # Without `web`, `horsies web` refuses with its message; that test runs
      # only in this run.
      - name: Test the client with default features
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/horsies
        run: cargo test -p horsies

      # The rerun adapters run against the server of DATABASE_URL.
      - name: Test the client with every feature
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/horsies
        run: cargo test -p horsies --features web,tokio-postgres,sqlx

  rust-showcase:
    needs: scope
    if: needs.scope.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect Rust showcase changes
        id: changed
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            base='${{ github.event.before }}'
          fi
          # Same rule as the webui job: an unknown base runs rather than skips.
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- rust/showcase/ crates/ Cargo.toml Cargo.lock rust-toolchain.toml; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Rust toolchain
        if: steps.changed.outputs.run == 'true'
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Cargo builds
        if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Enforce repository-only package
        if: steps.changed.outputs.run == 'true'
        run: grep -Eq '^publish[[:space:]]*=[[:space:]]*false[[:space:]]*$' rust/showcase/Cargo.toml

      - name: Check default features
        if: steps.changed.outputs.run == 'true'
        run: cargo check -p acme-showcase --tests

      - name: Test default features
        if: steps.changed.outputs.run == 'true'
        run: cargo test -p acme-showcase --all-targets

      - name: Check web feature
        if: steps.changed.outputs.run == 'true'
        run: cargo check -p acme-showcase --features web --tests

      - name: Test web feature
        if: steps.changed.outputs.run == 'true'
        run: cargo test -p acme-showcase --features web --all-targets
