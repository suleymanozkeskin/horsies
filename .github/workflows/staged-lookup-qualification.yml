name: Staged Task-History Lookup Qualification

# Manual evidence only. Correctness and release workflows do not invoke it.
on:
  workflow_dispatch:

permissions: {}

jobs:
  staged-lookup-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '14'
            service: pg14
            port: 15442
            image: docker.io/library/postgres:14@sha256:c6f9b7243c56553c050bec9a76bb9b9befb15b260ae1e4ac4bf9b56bd99c26a5
          - postgres: '16'
            service: pg16
            port: 15446
            image: docker.io/library/postgres:16@sha256:da8cf245a60506e50a0a8cbb0f39c559ca622d92490605b67fcadc74ca1ea8e4
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Start PostgreSQL ${{ matrix.postgres }} measurement server
        run: >-
          docker compose -f tests/fixtures/perf/compose.yaml
          up -d --wait ${{ matrix.service }}

      - name: Apply schema
        run: >-
          uv run python -m tests.perf --apply-schema
          --dsn postgresql+psycopg://postgres:testpassword@localhost:${{ matrix.port }}/horsies

      - name: Staged lookup boundary qualification
        timeout-minutes: 345
        shell: bash
        run: |
          output_dir=/tmp/task-history-staged-lookup-pg${{ matrix.postgres }}
          mkdir -p "$output_dir"
          output="$output_dir/staged_lookup.json"
          partial_output="$output_dir/staged_lookup.partial.json"
          candidate_output="$output.candidate"
          error_log="$output.stderr"
          exec 3>&1
          set +e
          timeout --foreground --signal=TERM --kill-after=30s 330m \
            uv run python -m tests.task_history_prototypes \
            --dsn postgresql+psycopg://postgres:testpassword@localhost:${{ matrix.port }}/horsies \
            --commit '${{ github.sha }}' \
            --run-kind gate \
            --server-image '${{ matrix.image }}' \
            --host-description 'GitHub-hosted ephemeral x86_64 VM; repository application units absent' \
            --storage-description 'GitHub-hosted runner Docker overlay2 storage' \
            --scenario identity-lookup \
            --identity-candidate staged_key_registry \
            --live-rows 100000 \
            --finite-history-rows 10000000 \
            --forever-history-rows 1000000 \
            --attached-finite-leaves 512 \
            --keyed-percent 10 \
            --warm-observations 10000 \
            --cold-observations 10000 \
            --bootstrap-resamples 1000 \
            --partial-evidence-path "$partial_output" \
            --progress-fd 3 \
            --demo-quiesced > "$candidate_output" 2> "$error_log"
          collector_status=$?
          set -e
          if (( collector_status != 0 )); then
            partial_evidence=null
            if [[ -s "$partial_output" ]]; then
              partial_evidence="$(jq -c . "$partial_output")"
            fi
            jq -n \
              --arg commit '${{ github.sha }}' \
              --arg postgres_major '${{ matrix.postgres }}' \
              --arg server_image '${{ matrix.image }}' \
              --argjson collector_status "$collector_status" \
              --argjson partial_evidence "$partial_evidence" \
              --rawfile error "$error_log" \
              '{
                status: "execution_failure",
                scenario: "staged-task-lookup",
                conditions: {
                  commit: $commit,
                  run_kind: "gate",
                  postgres_major: $postgres_major,
                  server_image: $server_image,
                  host_description: "GitHub-hosted ephemeral x86_64 VM; repository application units absent",
                  storage_description: "GitHub-hosted runner Docker overlay2 storage",
                  demo_quiesced: true,
                  fsync: "off",
                  synchronous_commit: "off",
                  full_page_writes: "off",
                  autovacuum: "off",
                  autovacuum_vacuum_threshold: "50",
                  autovacuum_vacuum_scale_factor: "0.2",
                  autovacuum_analyze_threshold: "50",
                  autovacuum_analyze_scale_factor: "0.1",
                  autovacuum_naptime: "1min",
                  autovacuum_max_workers: "3",
                  checkpoint_timeout: "30min",
                  max_wal_size: "4GB"
                },
                workload: {
                  candidate: "staged_key_registry",
                  live_rows: 100000,
                  finite_history_rows: 10000000,
                  forever_history_rows: 1000000,
                  attached_finite_leaves: 512,
                  keyed_percent: 10,
                  warm_observations_per_category: 10000,
                  cold_observation_ladder: [500, 2000, 10000],
                  cold_observations_maximum: 10000,
                  bootstrap_resamples: 1000
                },
                collector_exit_status: $collector_status,
                partial_evidence: $partial_evidence,
                error: $error
              }' > "$output"
            exit 1
          fi
          mv "$candidate_output" "$output"
          jq -e '
            (.candidates | length) == 1
            and .candidates[0].candidate == "staged_key_registry"
            and (.candidates[0].lookup | length) == 18
            and ([.candidates[0].lookup[].verdict] | all(. == "PASS"))
          ' "$output"

      - name: Preserve staged lookup qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staged-task-lookup-pg${{ matrix.postgres }}
          path: /tmp/task-history-staged-lookup-pg${{ matrix.postgres }}/*.json
          if-no-files-found: error

      - name: Stop PostgreSQL ${{ matrix.postgres }} measurement server
        if: always()
        run: docker compose -f tests/fixtures/perf/compose.yaml down -v
