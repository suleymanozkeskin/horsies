name: Full Test Suite

on:
  workflow_dispatch:
  # Callable so the release workflow gates publishing on this exact suite at
  # the exact commit being published, instead of maintaining its own copy.
  workflow_call:

permissions: {}

# The Python project is clients/python/. A step that runs uv at the
# repository root uses its pyproject.toml, uv.lock and .venv.
env:
  UV_PROJECT: ${{ github.workspace }}/clients/python

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: uv run pytest clients/python/tests/unit/ -v --tb=short

      # The unit tests of the cross-client harnesses in crossclient/:
      # the perf harness, the stored-form vectors and the package root. They
      # run from the repository root with the pytest settings of the Python
      # project.
      - name: Run the unit tests of the cross-client harnesses
        run: uv run pytest -c clients/python/pyproject.toml --rootdir . crossclient/perf/ crossclient/test_*.py -v --tb=short

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Both supported majors. The floor is documented and otherwise untested,
    # and the schema already carries one construct that exists only from 14 —
    # a dialect break there is invisible until an adopter finds it.
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '16']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run integration tests
        env:
          DB_PASSWORD: testpassword
        run: uv run pytest clients/python/tests/integration/ -v --tb=short

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      # The file list is derived, not enumerated: a hand-maintained list
      # silently stops covering whatever is added next. The runner gives each
      # file its own pytest process and cleans up workers after every file,
      # including failures. test_pgbouncer_smoke.py is excluded there — it
      # needs the PgBouncer topology and runs in the pgbouncer job below.
      - name: E2E suite (one pytest process per file)
        env:
          DB_PASSWORD: testpassword
        run: scripts/run_e2e_suite.sh -v --tb=short

  pgbouncer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Start PgBouncer fixture stack
        run: docker compose -f clients/python/tests/fixtures/pgbouncer/compose.yaml up -d --wait

      - name: PgBouncer integration contracts
        env:
          HORSIES_PGBOUNCER_TEST: "1"
          DB_PASSWORD: testpassword
          HORSIES_TEST_DATABASE_URL_DIRECT: postgresql://postgres:testpassword@localhost:15432/horsies
          HORSIES_TEST_DATABASE_URL_TRANSACTION: postgresql://postgres:testpassword@localhost:16432/horsies
          HORSIES_TEST_DATABASE_URL_PREPARED: postgresql://postgres:testpassword@localhost:16435/horsies
          HORSIES_TEST_DATABASE_URL_SESSION: postgresql://postgres:testpassword@localhost:16433/horsies
          HORSIES_TEST_DATABASE_URL_STATEMENT: postgresql://postgres:testpassword@localhost:16434/horsies
        run: |
          uv run pytest \
            clients/python/tests/integration/test_pgbouncer_contract.py \
            clients/python/tests/integration/test_pgbouncer_prepared_statements.py \
            -v --tb=short

      - name: PgBouncer e2e smoke
        env:
          HORSIES_PGBOUNCER_TEST: "1"
          DB_PASSWORD: testpassword
          HORSIES_TEST_DATABASE_URL_DIRECT: postgresql://postgres:testpassword@localhost:15432/horsies
          HORSIES_TEST_DATABASE_URL_TRANSACTION: postgresql://postgres:testpassword@localhost:16432/horsies
          HORSIES_TEST_DATABASE_URL_PREPARED: postgresql://postgres:testpassword@localhost:16435/horsies
          HORSIES_TEST_DATABASE_URL_SESSION: postgresql://postgres:testpassword@localhost:16433/horsies
          HORSIES_TEST_DATABASE_URL_STATEMENT: postgresql://postgres:testpassword@localhost:16434/horsies
        run: uv run pytest clients/python/tests/e2e/test_pgbouncer_smoke.py -v --tb=short

      - name: Stop PgBouncer fixture stack
        if: always()
        run: docker compose -f clients/python/tests/fixtures/pgbouncer/compose.yaml down -v

  # The OpenTelemetry Collector config of deploy/otel-collector/: the
  # Collector of clients/python/tests/fixtures/observability/compose.yaml
  # scrapes a worker endpoint and `horsies metrics`, which the test starts on
  # the runner, and writes the series as OTLP JSON. The containers use the
  # host network.
  observability-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      # The Collector image runs as user 10001; its file exporter writes here.
      - name: Create the folder of the OTLP file
        run: |
          mkdir --mode=a+rwx "$RUNNER_TEMP/otlp"
          echo "HORSIES_OTLP_OUTPUT_DIR=$RUNNER_TEMP/otlp" >> "$GITHUB_ENV"

      - name: Validate the shipped Collector config
        run: docker compose -f clients/python/tests/fixtures/observability/compose.yaml run --rm --no-deps collector validate --config=/etc/otelcol/collector.yaml

      - name: Start the observability stack
        run: docker compose -f clients/python/tests/fixtures/observability/compose.yaml up -d --wait

      - name: Observability stack test
        env:
          HORSIES_OBSERVABILITY_STACK_TEST: "1"
          DB_PASSWORD: testpassword
        run: uv run pytest clients/python/tests/e2e/test_observability_stack.py -v --tb=short

      - name: Logs of the observability stack
        if: failure()
        run: docker compose -f clients/python/tests/fixtures/observability/compose.yaml logs --no-color

      - name: Stop the observability stack
        if: always()
        run: docker compose -f clients/python/tests/fixtures/observability/compose.yaml down -v

  # The core, the extension module crate, the generator, the Rust client, its
  # macros and the examples on each supported Postgres major. The end-to-end
  # crates and the parity runs: rust-e2e. The PgBouncer lane: rust-pgbouncer.
  # serde_json's arbitrary_precision: rust-arbitrary-precision.
  rust-tests:
    name: rust-tests (Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # rustup is preinstalled on the runner. With no argument it installs the
      # toolchain and components that rust-toolchain.toml names.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      # horsies-python enables PyO3's `abi3-py313` feature, so its build script
      # needs a Python 3.13 interpreter; the runner's python3 is older.
      # `cargo test -p horsies-python` links libpython (the `extension-module`
      # feature is on only in the wheel build). This Python ships the shared
      # library, and the action puts its folder on LD_LIBRARY_PATH.
      - name: Install Python 3.13 for PyO3
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Point PyO3 at Python 3.13
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: echo "PYO3_PYTHON=$PYTHON_PATH" >> "$GITHUB_ENV"

      # One cache shared by the Postgres majors. Only runs on main write it.
      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check the client with no default features
        run: cargo check -p horsies --all-targets --no-default-features

      - name: Build the examples
        run: cargo build -p horsies-examples --examples

      # The compile-pass and compile-fail cases (trybuild).
      - name: Test the macros
        run: cargo test -p horsies-macros

      - name: Test the core derives
        run: cargo test -p horsies-core-derive

      # The core tests run in parallel, and one of them holds 66 sessions at
      # once (core/src/sql_tests/baseline_key_reservation_claim.rs). The
      # image's max_connections of 100 refuses some of them (SQLSTATE 53300).
      # ALTER SYSTEM takes effect at the restart.
      - name: Raise max_connections of the test server to 300
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -c "ALTER SYSTEM SET max_connections = 300"
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -q; then
              docker exec "$POSTGRES_CONTAINER" psql -U postgres -Atc "SHOW max_connections"
              exit 0
            fi
            sleep 1
          done
          echo "the test server accepts no connection 30 s after its restart" >&2
          exit 1

      # The core's tests create one database per test, copied from a
      # template that each test process installs, on the server of
      # DATABASE_URL (core/src/test_support/database.rs).
      - name: Create the core test database
        run: docker exec ${{ job.services.postgres.id }} createdb -U postgres horsies-core

      # The `web` feature adds the monitoring handler and its tests; no core
      # test needs the feature off.
      - name: Test the core
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/horsies-core
        run: cargo test -p horsies-core --features web

      - name: Test the extension module crate
        run: cargo test -p horsies-python

      - name: Test the generator
        run: cargo test -p horsies-codegen

      - name: Test the client with default features
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/horsies
        run: cargo test -p horsies

      - name: Test the client with every feature
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/horsies
        run: cargo test -p horsies --features web,tokio-postgres,sqlx

  # The showcase with its database tests: ACME_DATABASE_URL turns them on, and
  # they start the acme binary as the worker.
  rust-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test the showcase with default features
        env:
          ACME_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/acme_demo
        run: cargo test -p acme-showcase --all-targets

      - name: Test the showcase with the web feature
        env:
          ACME_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/acme_demo
        run: cargo test -p acme-showcase --features web --all-targets

  # The end-to-end crates of the Rust client (clients/rust/tests/worker,
  # support and queue_mismatch) and the parity runs with the Python client
  # (crossclient/parity with the binary of clients/rust/tests/parity), on
  # PostgreSQL 16. The test worker binary is the worker, its children and the
  # scheduler; each test has a database of its own on the server of
  # HORSIES_TEST_DATABASE_URL, and so has each side of a parity run.
  rust-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test the end-to-end crates
        env:
          HORSIES_TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/horsies
        run: cargo test -p horsies-test-worker -p horsies-test-support -p horsies-queue-mismatch-tests

      # The Python side of the parity runs: the client with horsies._core.
      - name: Install the Python client
        run: uv sync --dev

      - name: Build the Rust side of the parity runs
        run: cargo build -p horsies-parity-tests

      # crossclient/parity/snapshot holds the unit and integration tests of the
      # snapshot tool; tests.yml runs them.
      - name: Parity runs
        env:
          HORSIES_TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/horsies
          HORSIES_PARITY_RUST_BIN: ${{ github.workspace }}/target/debug/horsies-parity
        run: uv run pytest -c clients/python/pyproject.toml --rootdir . crossclient/parity --ignore=crossclient/parity/snapshot -v --tb=short

  # The Rust lane through the PgBouncer fixture of the Python client
  # (clients/python/tests/fixtures/pgbouncer/: PostgreSQL 18 on 15432, pools
  # in transaction, session and statement mode, max_prepared_statements = 0).
  # The core's PgBouncer tests are ignored unless the feature
  # pgbouncer-fixture-tests is on; this job turns it on. The end-to-end crates
  # run with every app on the transaction pool and the direct URL as its
  # session database (HORSIES_TEST_DATABASE_URL_TRANSACTION,
  # clients/rust/tests/support/src/database.rs).
  rust-pgbouncer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Start PgBouncer fixture stack
        run: docker compose -f clients/python/tests/fixtures/pgbouncer/compose.yaml up -d --wait

      # src/broker/pgbouncer_contract_tests.rs: each test creates its own
      # database through the direct URL. tests/db_statement_layer.rs: its two
      # PgBouncer tests use the pools as given; its other tests create their
      # databases on the server of DATABASE_URL.
      - name: Test the core on the PgBouncer pools
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:15432/horsies
          HORSIES_TEST_DATABASE_URL_DIRECT: postgresql://postgres:testpassword@localhost:15432/horsies
          HORSIES_TEST_DATABASE_URL_TRANSACTION: postgresql://postgres:testpassword@localhost:16432/horsies
          HORSIES_TEST_DATABASE_URL_SESSION: postgresql://postgres:testpassword@localhost:16433/horsies
          HORSIES_TEST_DATABASE_URL_STATEMENT: postgresql://postgres:testpassword@localhost:16434/horsies
          HORSIES_STMT_PGBOUNCER_STATEMENT_URL: postgresql://postgres:testpassword@localhost:16434/horsies
          HORSIES_STMT_PGBOUNCER_TRANSACTION_URL: postgresql://postgres:testpassword@localhost:16432/horsies
        run: |
          cargo test -p horsies-core --features pgbouncer-fixture-tests --lib pgbouncer_contract_tests
          cargo test -p horsies-core --features pgbouncer-fixture-tests --test db_statement_layer

      - name: Test the end-to-end crates through the transaction pool
        env:
          HORSIES_TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:15432/horsies
          HORSIES_TEST_DATABASE_URL_TRANSACTION: postgresql://postgres:testpassword@localhost:16432/horsies
        run: cargo test -p horsies-test-worker -p horsies-test-support -p horsies-queue-mismatch-tests

      - name: Stop PgBouncer fixture stack
        if: always()
        run: docker compose -f clients/python/tests/fixtures/pgbouncer/compose.yaml down -v

  # The core and the client built with serde_json's arbitrary_precision on,
  # as a dependency of a user's app can turn it on for the whole graph: the
  # crate clients/rust/tests/arbitrary-precision turns it on, and its test
  # proves that the flag is on. The client's tests run in the same graph.
  rust-arbitrary-precision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test the client with the flag on
        run: cargo test -p horsies -p horsies-arbitrary-precision-tests
