name: Full Test Suite

on:
  workflow_dispatch:

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run integration tests
        env:
          DB_PASSWORD: testpassword
        run: uv run pytest tests/integration/ -v --tb=short

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: E2E - Layer 1 (tasks)
        env:
          DB_PASSWORD: testpassword
        run: |
          uv run pytest tests/e2e/test_layer1_tasks.py -v --tb=short
          pkill -TERM -f "horsies worker" 2>/dev/null || true
          sleep 5

      - name: E2E - Layer 2 (cluster)
        env:
          DB_PASSWORD: testpassword
        run: |
          uv run pytest tests/e2e/test_layer2_cluster.py -v --tb=short
          pkill -TERM -f "horsies worker" 2>/dev/null || true
          sleep 5

      - name: E2E - Layer 3 (scheduler)
        env:
          DB_PASSWORD: testpassword
        run: |
          uv run pytest tests/e2e/test_layer3_scheduler.py -v --tb=short
          pkill -TERM -f "horsies worker" 2>/dev/null || true
          sleep 5

      - name: E2E - Layer 4 (workflow structure)
        env:
          DB_PASSWORD: testpassword
        run: |
          uv run pytest tests/e2e/test_layer4_workflow_structure.py -v --tb=short
          pkill -TERM -f "horsies worker" 2>/dev/null || true
          sleep 5

      - name: E2E - Layer 5 (workflow dataflow)
        env:
          DB_PASSWORD: testpassword
        run: |
          uv run pytest tests/e2e/test_layer5_workflow_dataflow.py -v --tb=short
          pkill -TERM -f "horsies worker" 2>/dev/null || true
          sleep 5

      - name: E2E - Layer 6 (workflow advanced)
        env:
          DB_PASSWORD: testpassword
        run: |
          uv run pytest tests/e2e/test_layer6_workflow_advanced.py -v --tb=short
          pkill -TERM -f "horsies worker" 2>/dev/null || true
          sleep 5

      - name: E2E - Fanout saturation
        env:
          DB_PASSWORD: testpassword
        run: |
          uv run pytest tests/e2e/test_fanout_saturation.py -v --tb=short
          pkill -TERM -f "horsies worker" 2>/dev/null || true
          sleep 5

      - name: E2E - Task timeout
        env:
          DB_PASSWORD: testpassword
        run: |
          uv run pytest tests/e2e/test_task_timeout.py -v --tb=short
          pkill -TERM -f "horsies worker" 2>/dev/null || true
          sleep 5

      - name: E2E - Child-process hooks
        env:
          DB_PASSWORD: testpassword
        run: uv run pytest tests/e2e/test_child_process_hooks.py -v --tb=short

  pgbouncer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Start PgBouncer fixture stack
        run: docker compose -f tests/fixtures/pgbouncer/compose.yaml up -d --wait

      - name: PgBouncer integration contracts
        env:
          HORSIES_PGBOUNCER_TEST: "1"
          DB_PASSWORD: testpassword
          HORSIES_TEST_DATABASE_URL_DIRECT: postgresql+psycopg://postgres:testpassword@localhost:15432/horsies
          HORSIES_TEST_DATABASE_URL_TRANSACTION: postgresql+psycopg://postgres:testpassword@localhost:16432/horsies
          HORSIES_TEST_DATABASE_URL_PREPARED: postgresql+psycopg://postgres:testpassword@localhost:16435/horsies
          HORSIES_TEST_DATABASE_URL_SESSION: postgresql+psycopg://postgres:testpassword@localhost:16433/horsies
          HORSIES_TEST_DATABASE_URL_STATEMENT: postgresql+psycopg://postgres:testpassword@localhost:16434/horsies
        run: |
          uv run pytest \
            tests/integration/test_pgbouncer_contract.py \
            tests/integration/test_pgbouncer_prepared_statements.py \
            tests/integration/test_pgbouncer_rolling_upgrade.py \
            -v --tb=short

      - name: PgBouncer e2e smoke
        env:
          HORSIES_PGBOUNCER_TEST: "1"
          DB_PASSWORD: testpassword
          HORSIES_TEST_DATABASE_URL_DIRECT: postgresql+psycopg://postgres:testpassword@localhost:15432/horsies
          HORSIES_TEST_DATABASE_URL_TRANSACTION: postgresql+psycopg://postgres:testpassword@localhost:16432/horsies
          HORSIES_TEST_DATABASE_URL_PREPARED: postgresql+psycopg://postgres:testpassword@localhost:16435/horsies
          HORSIES_TEST_DATABASE_URL_SESSION: postgresql+psycopg://postgres:testpassword@localhost:16433/horsies
          HORSIES_TEST_DATABASE_URL_STATEMENT: postgresql+psycopg://postgres:testpassword@localhost:16434/horsies
        run: uv run pytest tests/e2e/test_pgbouncer_smoke.py -v --tb=short

      - name: Stop PgBouncer fixture stack
        if: always()
        run: docker compose -f tests/fixtures/pgbouncer/compose.yaml down -v
