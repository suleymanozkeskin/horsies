name: Full Test Suite

on:
  workflow_dispatch:
  # Callable so the release workflow gates publishing on this exact suite at
  # the exact commit being published, instead of maintaining its own copy.
  workflow_call:

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Both supported majors. The floor is documented and otherwise untested,
    # and the schema already carries one construct that exists only from 14 —
    # a dialect break there is invisible until an adopter finds it.
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '16']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run integration tests
        env:
          DB_PASSWORD: testpassword
        run: uv run pytest tests/integration/ -v --tb=short

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      # The file list is derived, not enumerated: a hand-maintained list
      # silently stops covering whatever is added next. The runner gives each
      # file its own pytest process and cleans up workers after every file,
      # including failures. test_pgbouncer_smoke.py is excluded there — it
      # needs the PgBouncer topology and runs in the pgbouncer job below.
      - name: E2E suite (one pytest process per file)
        env:
          DB_PASSWORD: testpassword
        run: scripts/run_e2e_suite.sh -v --tb=short

  pgbouncer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Start PgBouncer fixture stack
        run: docker compose -f tests/fixtures/pgbouncer/compose.yaml up -d --wait

      - name: PgBouncer integration contracts
        env:
          HORSIES_PGBOUNCER_TEST: "1"
          DB_PASSWORD: testpassword
          HORSIES_TEST_DATABASE_URL_DIRECT: postgresql+psycopg://postgres:testpassword@localhost:15432/horsies
          HORSIES_TEST_DATABASE_URL_TRANSACTION: postgresql+psycopg://postgres:testpassword@localhost:16432/horsies
          HORSIES_TEST_DATABASE_URL_PREPARED: postgresql+psycopg://postgres:testpassword@localhost:16435/horsies
          HORSIES_TEST_DATABASE_URL_SESSION: postgresql+psycopg://postgres:testpassword@localhost:16433/horsies
          HORSIES_TEST_DATABASE_URL_STATEMENT: postgresql+psycopg://postgres:testpassword@localhost:16434/horsies
        run: |
          uv run pytest \
            tests/integration/test_pgbouncer_contract.py \
            tests/integration/test_pgbouncer_prepared_statements.py \
            tests/integration/test_pgbouncer_rolling_upgrade.py \
            -v --tb=short

      - name: PgBouncer e2e smoke
        env:
          HORSIES_PGBOUNCER_TEST: "1"
          DB_PASSWORD: testpassword
          HORSIES_TEST_DATABASE_URL_DIRECT: postgresql+psycopg://postgres:testpassword@localhost:15432/horsies
          HORSIES_TEST_DATABASE_URL_TRANSACTION: postgresql+psycopg://postgres:testpassword@localhost:16432/horsies
          HORSIES_TEST_DATABASE_URL_PREPARED: postgresql+psycopg://postgres:testpassword@localhost:16435/horsies
          HORSIES_TEST_DATABASE_URL_SESSION: postgresql+psycopg://postgres:testpassword@localhost:16433/horsies
          HORSIES_TEST_DATABASE_URL_STATEMENT: postgresql+psycopg://postgres:testpassword@localhost:16434/horsies
        run: uv run pytest tests/e2e/test_pgbouncer_smoke.py -v --tb=short

      - name: Stop PgBouncer fixture stack
        if: always()
        run: docker compose -f tests/fixtures/pgbouncer/compose.yaml down -v
