name: Full Test Suite

on:
  workflow_dispatch:
  # Callable so the release workflow gates publishing on this exact suite at
  # the exact commit being published, instead of maintaining its own copy.
  workflow_call:

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Both supported majors. The floor is documented and otherwise untested,
    # and the schema already carries one construct that exists only from 14 —
    # a dialect break there is invisible until an adopter finds it.
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '16']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run integration tests
        env:
          DB_PASSWORD: testpassword
        run: uv run pytest tests/integration/ -v --tb=short

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      # The file list is derived, not enumerated: a hand-maintained list
      # silently stops covering whatever is added next. The runner gives each
      # file its own pytest process and cleans up workers after every file,
      # including failures. test_pgbouncer_smoke.py is excluded there — it
      # needs the PgBouncer topology and runs in the pgbouncer job below.
      - name: E2E suite (one pytest process per file)
        env:
          DB_PASSWORD: testpassword
        run: scripts/run_e2e_suite.sh -v --tb=short

  pgbouncer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Start PgBouncer fixture stack
        run: docker compose -f tests/fixtures/pgbouncer/compose.yaml up -d --wait

      - name: PgBouncer integration contracts
        env:
          HORSIES_PGBOUNCER_TEST: "1"
          DB_PASSWORD: testpassword
          HORSIES_TEST_DATABASE_URL_DIRECT: postgresql://postgres:testpassword@localhost:15432/horsies
          HORSIES_TEST_DATABASE_URL_TRANSACTION: postgresql://postgres:testpassword@localhost:16432/horsies
          HORSIES_TEST_DATABASE_URL_PREPARED: postgresql://postgres:testpassword@localhost:16435/horsies
          HORSIES_TEST_DATABASE_URL_SESSION: postgresql://postgres:testpassword@localhost:16433/horsies
          HORSIES_TEST_DATABASE_URL_STATEMENT: postgresql://postgres:testpassword@localhost:16434/horsies
        run: |
          uv run pytest \
            tests/integration/test_pgbouncer_contract.py \
            tests/integration/test_pgbouncer_prepared_statements.py \
            -v --tb=short

      - name: PgBouncer e2e smoke
        env:
          HORSIES_PGBOUNCER_TEST: "1"
          DB_PASSWORD: testpassword
          HORSIES_TEST_DATABASE_URL_DIRECT: postgresql://postgres:testpassword@localhost:15432/horsies
          HORSIES_TEST_DATABASE_URL_TRANSACTION: postgresql://postgres:testpassword@localhost:16432/horsies
          HORSIES_TEST_DATABASE_URL_PREPARED: postgresql://postgres:testpassword@localhost:16435/horsies
          HORSIES_TEST_DATABASE_URL_SESSION: postgresql://postgres:testpassword@localhost:16433/horsies
          HORSIES_TEST_DATABASE_URL_STATEMENT: postgresql://postgres:testpassword@localhost:16434/horsies
        run: uv run pytest tests/e2e/test_pgbouncer_smoke.py -v --tb=short

      - name: Stop PgBouncer fixture stack
        if: always()
        run: docker compose -f tests/fixtures/pgbouncer/compose.yaml down -v

  rust-tests:
    name: rust-tests (${{ matrix.features }}, Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # Default features on Postgres 14, 16 and 18. The `web` and
    # `arbitrary-precision` runs use 16.
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default
            postgres: '14'
            command: cargo test --workspace
          - features: default
            postgres: '16'
            command: cargo test --workspace
            planning_counters: true
          - features: default
            postgres: '18'
            command: cargo test --workspace
          # `web` only adds the web module and the `horsies web` CLI; the rest
          # of the workspace compiles to the same code as the default run.
          - features: web
            postgres: '16'
            command: cargo test -p horsies --features web
          # `arbitrary-precision` changes serde_json number handling for the
          # whole build graph, so the whole workspace runs again.
          - features: arbitrary-precision
            postgres: '16'
            command: cargo test --workspace --features horsies/arbitrary-precision
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: horsies-rust-port
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # rustup is preinstalled on the runner. With no argument it installs the
      # toolchain and components that rust-toolchain.toml names.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      # One cache per feature set, shared by the Postgres majors. Only runs
      # on main write it.
      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The two claim_candidate_plan_ tests read planning counts from
      # pg_stat_statements, which needs the library preloaded at server start.
      # They are #[ignore] in the default run and are selected here by name.
      - name: Preload pg_stat_statements
        if: ${{ matrix.planning_counters }}
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d horsies-rust-port -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          docker restart ${{ job.services.postgres.id }}
          for attempt in {1..30}; do
            if docker exec ${{ job.services.postgres.id }} pg_isready -U postgres; then
              break
            fi
            sleep 1
          done
          docker exec ${{ job.services.postgres.id }} pg_isready -U postgres

      - name: Verify claim candidate plan reuse
        if: ${{ matrix.planning_counters }}
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/horsies-rust-port
        run: cargo test --workspace claim_candidate_plan_ -- --ignored --test-threads=1

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/horsies-rust-port
        run: ${{ matrix.command }}

  rust-pgbouncer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The contract tests start this binary as the worker process.
      - name: Build test worker binary
        run: cargo build -p horsies-test-worker --bin horsies-test-worker

      # The Rust stack, not tests/fixtures/pgbouncer/: its transaction lane
      # sets max_prepared_statements = 200, which SQLx needs
      # (rust/tests/fixtures/pgbouncer/README.md).
      - name: Start PgBouncer fixture stack
        run: docker compose -f rust/tests/fixtures/pgbouncer/compose.yaml up -d --wait

      - name: PgBouncer contracts
        env:
          HORSIES_PGBOUNCER_TEST: "1"
          DB_PASSWORD: testpassword
          HORSIES_TEST_DATABASE_URL_DIRECT: postgresql://postgres:testpassword@localhost:15432/horsies
          HORSIES_TEST_DATABASE_URL_TRANSACTION: postgresql://postgres:testpassword@localhost:16432/horsies
          HORSIES_TEST_DATABASE_URL_PREPARED: postgresql://postgres:testpassword@localhost:16435/horsies
          HORSIES_TEST_DATABASE_URL_SESSION: postgresql://postgres:testpassword@localhost:16433/horsies
          HORSIES_TEST_DATABASE_URL_STATEMENT: postgresql://postgres:testpassword@localhost:16434/horsies
        run: cargo test -p horsies-test-worker --test pgbouncer_contract -- --test-threads=1

      - name: Stop PgBouncer fixture stack
        if: always()
        run: docker compose -f rust/tests/fixtures/pgbouncer/compose.yaml down -v

  rust-webui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust/webui
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # lint:tokens checks the lines added in origin/main...HEAD.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # The frozen rust/webui/ copy keeps the bun its CI used before the
          # import.
          bun-version: "1.2.23"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Check design tokens
        run: bun run lint:tokens

      # Builds into crates/horsies/webui-dist/ and fails if the committed
      # build differs (rust/scripts/check-webui-dist.sh).
      - name: Check committed build
        run: bun run check:dist
