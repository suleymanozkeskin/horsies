[package]
name = "horsies-core"
version = "0.1.0-alpha.36"
edition = "2021"
description = "Shared core of the horsies task queue and workflow engine, used by the horsies clients"
license = "MIT"
repository = "https://github.com/suleymanozkeskin/horsies"
readme = "README.md"
keywords = ["task-queue", "workflow", "distributed", "postgresql", "async"]
categories = ["asynchronous", "database"]

[lib]
name = "horsies_core"

[features]
default = []
# Retain the source lexeme of every JSON number, for byte-exact rerun-input
# fingerprints over integers outside the i64/u64 domain. The flag changes
# `serde_json` number handling for the whole build graph, so it is opt-in:
# with it on, every `#[serde(flatten)]`, `#[serde(tag)]` and
# `#[serde(untagged)]` container in the graph rejects typed floats.
arbitrary-precision = ["serde_json/arbitrary_precision"]
web = [
    "dep:async-stream",
    "dep:async-trait",
    "dep:axum",
    "dep:bytes",
    "dep:futures-core",
    "dep:form_urlencoded",
    "dep:http",
    "dep:include_dir",
    "dep:mime_guess",
    "dep:percent-encoding",
    "dep:tower",
    "tokio/net",
]

[dependencies]
# The `CodeCatalog` derive of the code enums and the `ManifestSchema` derive
# of the manifest types.
horsies-macros = { version = "0.1.0-alpha.36", path = "../horsies-macros" }
async-stream = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8", optional = true }
# The HTTP types of the public `web` API (`web::{Bytes, HeaderName,
# HeaderValue, Method, StatusCode}`): axum re-exports the same types, and
# stays internal to the router of the handler.
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
futures-core = { version = "0.3", optional = true }
form_urlencoded = { version = "1", optional = true }
include_dir = { version = "0.7", optional = true }
mime_guess = { version = "2", optional = true }
percent-encoding = { version = "2", optional = true }
tower = { version = "0.5", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "signal", "macros", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
# `raw_value`: stored results are read as raw text first. `unbounded_depth`: a
# text that the strict reader bounded at 300 levels is decoded past serde_json's
# own limit of 128 (`core::codec::from_json_str`). `preserve_order`: an object
# keeps its members in insertion order, as a Python dict does, so a stored
# object is written in Python's member order
# (`tests/fixtures/stored_forms/README.md`).
serde_json = { version = "1", features = ["raw_value", "unbounded_depth", "preserve_order"] }
serde_path_to_error = "0.1"
serde_plain = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json"] }
# The statement layer (src/db). Exact pins: a driver update is a reviewed change.
tokio-postgres = { version = "=0.7.18", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool = { version = "=0.13.1", default-features = false, features = ["managed", "rt_tokio_1"] }
deadpool-postgres = { version = "=0.14.2", default-features = false, features = ["rt_tokio_1"] }
tokio-postgres-rustls = "=0.14.0"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "=0.8.5"
whoami = "2.1"
tracing = "0.1"
sha2 = "0.10"
log = "0.4"
rand = "0.8"
gethostname = "0.4"
owo-colors = "4"
toml = "0.8"
sysinfo = "0.32"
libc = "0.2"

[lints]
workspace = true

[dev-dependencies]
# The JSON schema of the monitoring models, for the contract test with the
# Pydantic models (`src/monitoring/model_contract_tests.rs`). Tests only: the
# shipped core does not depend on it.
schemars = { version = "1", features = ["chrono04", "uuid1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util", "net", "io-util"] }
serial_test = "3"
futures = "0.3"
http-body-util = "0.1"
# The scan of the log events (`tests/log_message_errors.rs`): the lexer of
# Rust source into token trees, with line numbers, and the decoder of string
# literals. Tests only.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", default-features = false }
