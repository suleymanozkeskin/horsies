[package]
name = "horsies-core"
version = "0.1.0-alpha.36"
edition = "2021"
description = "Unified public API for the horsies task queue and workflow engine"
license = "MIT"
repository = "https://github.com/suleymanozkeskin/horsies"
readme = "README.md"
keywords = ["task-queue", "workflow", "distributed", "postgresql", "async"]
categories = ["asynchronous", "database"]
publish = false

[lib]
name = "horsies_core"

[features]
default = []
# Retain the source lexeme of every JSON number, for byte-exact rerun-input
# fingerprints over integers outside the i64/u64 domain. The flag changes
# `serde_json` number handling for the whole build graph, so it is opt-in:
# with it on, every `#[serde(flatten)]`, `#[serde(tag)]` and
# `#[serde(untagged)]` container in the graph rejects typed floats.
arbitrary-precision = ["serde_json/arbitrary_precision"]
web = [
    "dep:async-stream",
    "dep:async-trait",
    "dep:axum",
    "dep:futures-core",
    "dep:form_urlencoded",
    "dep:include_dir",
    "dep:mime_guess",
    "dep:percent-encoding",
    "dep:tower",
    "tokio/net",
]

[dependencies]
async-stream = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8", optional = true }
futures-core = { version = "0.3", optional = true }
form_urlencoded = { version = "1", optional = true }
include_dir = { version = "0.7", optional = true }
mime_guess = { version = "2", optional = true }
percent-encoding = { version = "2", optional = true }
tower = { version = "0.5", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "signal", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
# `raw_value`: stored results are read as raw text first. `unbounded_depth`: a
# text that the strict reader bounded at 300 levels is decoded past serde_json's
# own limit of 128 (`core::codec::from_json_str`).
serde_json = { version = "1", features = ["raw_value", "unbounded_depth"] }
serde_plain = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }
tracing = "0.1"
sha2 = "0.10"
log = "0.4"
rand = "0.8"
gethostname = "0.4"
owo-colors = "4"
toml = "0.8"
sysinfo = "0.32"

[lints]
workspace = true

[dev-dependencies]
# Tests of the workflow DSL derive `WorkflowInput`.
horsies-macros = { path = "../horsies-macros" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util", "net", "io-util"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"] }
serial_test = "3"
futures = "0.3"
http-body-util = "0.1"
